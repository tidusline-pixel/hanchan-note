<h1>データの扱い</h1>
<h2>記録</h2>
<p>入力した名前・点数・精算などの記録は、使っている端末の中だけに保存します。作者のサーバーには送りません。</p>
<p>端末の故障、機種変更、ブラウザのデータ削除で記録が消えることがあります。残したいときはバックアップ（拡張機能）を使ってください。</p>
<h2>広告</h2>
<p>広告を表示する場合、広告の配信会社が Cookie などを使って、興味に合わせた広告を出すことがあります。広告は記録を読めないよう、アプリと切り離して表示します。Cookie はブラウザの設定で無効にできます。</p>
