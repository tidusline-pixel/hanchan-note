<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>半荘ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#4f6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="半荘ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* 層：上に条件バー → 数字 → グラフ → 一覧。下に固定のタブ。雀簿寄りのくすんだ緑と丸い角 */
:root{
  --bg:#f3f4ee; --card:#fbfbf7; --fg:#26302a; --mute:#6c776f; --line:#dde2d6;
  --accent:#4f6b55; --accent-weak:#e3ebe0; --plus:#2f6fb0; --minus:#c0443b; --gold:#b8892c;
  --r1:#4f6b55; --r2:#86a17c; --r3:#c9b77f; --r4:#c98a7a;
  --font:"Meiryo","メイリオ","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181c19; --card:#212722; --fg:#e7ebe4; --mute:#9aa59c; --line:#323a33;
  --accent:#8fb293; --accent-weak:#2b362d; --plus:#7fb2e8; --minus:#ec8a80; --gold:#d9b25c;
  --r1:#8fb293; --r2:#5f7d5f; --r3:#a99a63; --r4:#a8695b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181c19; --card:#212722; --fg:#e7ebe4; --mute:#9aa59c; --line:#323a33;
  --accent:#8fb293; --accent-weak:#2b362d; --plus:#7fb2e8; --minus:#ec8a80; --gold:#d9b25c;
  --r1:#8fb293; --r2:#5f7d5f; --r3:#a99a63; --r4:#a8695b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap,.card,.stack,.grid2>*,.grid3>*,.row>*{min-width:0}
input[type=date],input:not([type]),select{width:100%}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;letter-spacing:.04em}
header.top .sub{color:var(--mute);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.stack{display:grid;gap:12px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0;color:var(--mute);font-weight:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
button.ghost{background:transparent}
button.small{padding:3px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border-radius:999px;padding:4px 12px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--card);border-color:var(--accent)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
input[type=number]{width:100%;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:grid;gap:2px;font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{font-variant-numeric:tabular-nums}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:normal;color:var(--mute);font-size:12px}
.note{color:var(--mute);font-size:12px}
.warn{color:var(--minus);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:none;background:transparent;border-radius:10px;padding:6px 0;display:grid;gap:0;justify-items:center;font-size:12px;color:var(--mute)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-weak)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.item .meta{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chartbox{position:relative;height:220px}
.sfield{display:flex;gap:4px;align-items:stretch}
.sfield input{flex:1;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.sfield .pm{padding:0 11px;border-radius:10px;font-size:18px;line-height:1;background:var(--accent-weak);color:var(--accent);border-color:var(--line)}
.free-out{font-size:32px;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums}
.adbox{margin-top:12px;display:grid;justify-items:center;gap:2px}
.adbox iframe{border:0;width:300px;height:250px;max-width:100%}
.lock{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 6px;margin-left:6px}
textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px}
.sample{background:var(--accent-weak);color:var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>半荘ノート</h1><div class="sub">麻雀の点数・精算・成績 <span class="badge">試作版</span></div></div>
  </header>
  <main id="view" class="stack"></main>
  <aside id="adBox" class="adbox" aria-label="広告" hidden></aside>
</div>

<nav class="tabs" aria-label="画面の切り替え">
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>成績</button>
  <button data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>記録</button>
  <button data-tab="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h1M12 12h1M15 12h.5M8.5 16h1M12 16h1M15 16h.5"/></svg>フリー</button>
  <button data-tab="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 3.9 1.8 4.5 4.5"/></svg>メンバー</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>設定</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="core.js"></script>

<script>
const ADS_ON=false; // 広告を出すときだけ true。中身は frame.html
/* ===== 保存（この端末の中だけ） ===== */
const KEY="jakuroku-v1";
const uid=()=>Math.random().toString(36).slice(2,9);
let db, idb=null, saveBroken=false;
function sample(){
  const P=[["たろう","#4f6b55"],["はなこ","#2f6fb0"],["じろう","#c0443b"],["さぶろう","#b8892c"]].map(([name,color])=>({id:uid(),name,color,sample:true}));
  const [a,b,c,d]=P.map(p=>p.id);
  const mk=(date,title,tags,preset,members,games,chips,rate)=>{const rule={...RULE_PRESETS[preset]}; if(rate)rule.rate=rate;
    return {id:uid(),date,title,tags,rule,members,games:games.map(g=>({scores:Object.fromEntries(members.map((m,i)=>[m,g[i]]))})),chips:Object.fromEntries(members.map((m,i)=>[m,chips[i]])),sample:true};};
  const S=[
    mk("2026-08-02","駅前セット",["雀荘A"],"m4",[a,b,c,d],[[42000,31000,17000,10000],[25000,38000,22000,15000],[30500,30500,24000,15000]],[0,0,0,0],50),
    mk("2026-09-13","家麻雀",["家"],"m3",[a,b,c],[[52000,38000,15000],[30000,47000,28000],[61000,24000,20000]],[3,-1,-2],50),
    mk("2026-10-04","駅前セット",["雀荘A"],"m4",[a,b,c,d],[[18000,44000,26000,12000],[39000,27000,21000,13000]],[0,0,0,0],100),
    mk("2026-10-25","家麻雀",["家"],"m3",[a,b,d],[[45000,35000,25000],[20000,40000,45000],[50000,40000,15000]],[2,0,-2],100),
  ];
  return {players:P,sessions:S,saved:[],settings:{mode:"easy",unlocked:false},sample:true};
}
function idbOpen(){ return new Promise((ok,ng)=>{const r=indexedDB.open("hanchan-note",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);}); }
function idbDo(mode,fn){ return new Promise((ok,ng)=>{const tx=idb.transaction("kv",mode); const q=fn(tx.objectStore("kv")); tx.oncomplete=()=>ok(q.result); tx.onerror=tx.onabort=()=>ng(tx.error);}); }
// IndexedDB を先に見る。前の版の localStorage に記録があれば引き継ぐ
async function load(){
  let v=null, ls=null;
  try{ idb=await idbOpen(); v=await idbDo("readonly",s=>s.get("db")); snaps=await idbDo("readonly",s=>s.get("snaps"))||[]; }catch(e){ idb=null; }
  try{ ls=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(v && (!ls || (ls.savedAt||0)<=(v.savedAt||0))) return v;
  if(ls){ db=ls; save(); return ls; }
  return sample();
}
let saveQueue=Promise.resolve(), snaps=[];
// 落ちても失わないよう、その場で localStorage にも書く。起動のときは新しいほうを使う
function save(){
  db.savedAt=Date.now();
  const text=JSON.stringify(db);
  let kept=false; try{ localStorage.setItem(KEY,text); kept=true; }catch(e){}
  saveQueue=saveQueue.then(async()=>{
    try{ if(!idb) throw 0; await idbDo("readwrite",s=>s.put(JSON.parse(text),"db")); }
    catch(e){ if(!kept){ saveBroken=true; render(); } }
  });
}
function takeSnap(force){
  const next=nextSnaps(snaps,db,Date.now(),force);
  if(next===snaps||!idb) return;
  snaps=next;
  saveQueue=saveQueue.then(()=>idbDo("readwrite",s=>s.put(next,"snaps"))).catch(()=>{});
}
// 開いていた画面と入れかけの数字。アプリが落ちても、開き直せば続きから入れられる
const RESUME="hanchan-resume";
let resume={sc:{},free:{}};
function readResume(){
  try{ resume={...resume,...JSON.parse(localStorage.getItem(RESUME))}; }catch(e){}
  if(["stats","sessions","free","players","settings"].includes(resume.tab)) tab=resume.tab;
  openSession=resume.open||null;
  freeRank=resume.free.rank||1;
}
function keepResume(){ try{ localStorage.setItem(RESUME,JSON.stringify({...resume,tab,open:openSession})); }catch(e){} }
const unlocked=()=>!!db.settings.unlocked;
const P=id=>db.players.find(p=>p.id===id)||{name:"?",color:"#888"};
const fmtAt=t=>new Date(t+9*3600e3).toISOString().slice(0,16).replace("T"," ");
const fmtP=v=>(v>0?"+":"")+v.toLocaleString("ja-JP")+"P";
const fmtPt=v=>(v>0?"+":"")+v.toFixed(1);
const cls=v=>v>0?"plus":v<0?"minus":"";
const pct=v=>(v*100).toFixed(0)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);

/* ===== 画面 ===== */
let tab="stats", openSession=null, charts=[];
let filter={from:"",to:"",mode:"",rates:[],tags:[],members:[],pick:[]};
const view=document.getElementById("view");
// スマホの数字キーには「-」が無いので、欄の横のボタンでマイナスにする
const sfield=(attrs,val="")=>`<span class="sfield"><button type="button" class="pm" data-pm aria-label="マイナスにする">−</button><input inputmode="decimal" autocomplete="off" ${attrs} value="${esc(val)}"></span>`;
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-pm]"); if(!b) return;
  e.preventDefault();
  const i=b.parentNode.querySelector("input"), body=i.value.replace(/[-−ー▲△\s]/g,"");
  i.value=/[-−ー▲△]/.test(i.value)?body:"-"+body;
  i.dispatchEvent(new Event("input",{bubbles:true}));
  if(body) i.dispatchEvent(new Event("change",{bubbles:true})); else i.focus();
});
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openSession=null;render();});

function render(){
  keepResume();
  charts.forEach(c=>c.destroy()); charts=[];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab));
  const banner = db.sample ? `<div class="sample"><span>いま入っているのは見本のデータです</span><button class="small" id="clearSample">見本を消して始める</button></div>`:"";
  const notice = db.settings.noticeDone ? "" : `<div class="sample"><span>記録はこの端末の中だけに残ります。iPhone はホーム画面に追加して使ってください。機種変更やブラウザのデータ削除で消えるので、残したいときはバックアップ（拡張機能）を使ってください。</span><button class="small" id="noticeOk">わかった</button></div>`;
  const broken = saveBroken ? `<p class="warn">記録を保存できませんでした。端末の空き容量を確かめてください。</p>`:"";
  const due = unlocked() && (tab==="stats"||(tab==="sessions"&&!openSession)) && backupDue(db,Date.now()) ? `<div class="sample"><span>ファイルに保存していない記録が ${unsavedGames(db)}半荘あります</span><button class="small" id="bkDue">保存する</button></div>`:"";
  view.innerHTML = broken + notice + due + (tab==="free"?"":banner) + ({stats:viewStats,sessions:viewSessions,free:viewFree,players:viewPlayers,settings:viewSettings}[tab])();
  const cs=document.getElementById("clearSample"); if(cs) cs.onclick=()=>{db={players:[],sessions:[],saved:[],settings:db.settings,free:db.free};save();render();};
  const bd=document.getElementById("bkDue"); if(bd) bd.onclick=saveBackup;
  const no=document.getElementById("noticeOk"); if(no) no.onclick=()=>{db.settings.noticeDone=true;save();render();};
  ({stats:bindStats,sessions:bindSessions,free:bindFree,players:bindPlayers,settings:bindSettings}[tab])();
  showAd();
}
// 成績タブの下にだけ出す。読み直しで表示回数が増えないよう、枠は1回だけ作る。記録に触れないよう隔離する
function showAd(){
  const box=document.getElementById("adBox");
  const on=ADS_ON && tab==="stats" && !unlocked() && navigator.onLine;
  box.hidden=!on;
  if(on && !box.firstChild) box.innerHTML=`<span class="note">広告</span><iframe src="frame.html" title="広告" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>`;
}

/* --- 成績 --- */
function allRates(){ return [...new Set(db.sessions.map(s=>Number(s.rule.rate)))].sort((a,b)=>a-b); }
function allTags(){ return [...new Set(db.sessions.flatMap(s=>s.tags||[]))]; }
function viewStats(){
  const sel=filterSessions(db.sessions,filter);
  const n = filter.mode? Number(filter.mode) : (sel.every(s=>s.rule.mode===3)&&sel.length?3:4);
  const st=playerStats(sel,n);
  const ids=Object.keys(st).sort((a,b)=>st[b].yen-st[a].yen);
  const chipRow=(arr,key,label)=>arr.map(v=>`<button class="chip" data-f="${key}" data-v="${esc(v.v)}" aria-pressed="${v.on}">${esc(v.l)}</button>`).join("");
  const pickList = db.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<label class="row" style="gap:6px"><input type="checkbox" data-pick="${s.id}" ${filter.pick.includes(s.id)?"checked":""}> <span class="num">${s.date}</span> ${esc(s.title||"")} <span class="note">${s.rule.mode}人・${s.rule.rate}P</span></label>`).join("");
  return `
  <section class="card" aria-labelledby="fh">
    <div class="row between"><h2 id="fh">集計の条件</h2><span class="note">${sel.length}件のセッションが対象</span></div>
    <div class="grid2"><label class="f">いつから<input type="date" id="ffrom" value="${filter.from}"></label><label class="f">いつまで<input type="date" id="fto" value="${filter.to}"></label></div>
    <div class="row">${chipRow([{v:"",l:"四麻と三麻",on:!filter.mode},{v:"4",l:"四麻",on:filter.mode==="4"},{v:"3",l:"三麻",on:filter.mode==="3"}],"mode")}</div>
    ${!filter.mode?'<p class="note">四麻と三麻をまとめると、着順の数字は混ざります。どちらかを選ぶと正確です。</p>':""}
    <div class="row"><span class="note">千点あたり</span>${chipRow(allRates().map(r=>({v:r,l:r+"P/千点",on:filter.rates.includes(r)})),"rates")}</div>
    <div class="row"><span class="note">場所</span>${chipRow(allTags().map(t=>({v:t,l:t,on:filter.tags.includes(t)})),"tags")}</div>
    <div class="row"><span class="note">この人がいる回</span>${chipRow(db.players.map(p=>({v:p.id,l:p.name,on:filter.members.includes(p.id)})),"members")}</div>
    <details ${filter.pick.length?"open":""}><summary>セッションを選んで集計する（${filter.pick.length?filter.pick.length+"件選択中":"選ばなければ全部"}）</summary><div class="stack" style="margin-top:8px">${pickList||'<span class="note">記録がまだありません</span>'}</div></details>
    <div class="row between">
      <div class="row">${db.saved.map((sv,i)=>`<button class="chip" data-load="${i}">${esc(sv.name)}</button>`).join("")}</div>
      <div class="row"><button class="small ghost" id="freset">条件を外す</button><button class="small" id="fsave">この条件を保存${unlocked()?"":'<span class="lock">拡張</span>'}</button></div>
    </div>
    <div id="saveBox" hidden class="row"><input id="saveName" placeholder="例：三麻・今年"><button class="small primary" id="saveOk">保存</button></div>
    <div id="saveLock" hidden class="row"><span class="note">条件の保存は拡張機能です。設定タブで解放コードを入れると使えます。</span><button class="small" id="toSettings">設定へ</button></div>
  </section>
  ${ids.length? `
  <section class="card" aria-labelledby="sh">
    <h2 id="sh">成績</h2>
    <div class="tablebox"><table>
      <thead><tr><th>名前</th><th>収支</th><th>ポイント</th><th>半荘</th><th>平均着順</th><th>トップ率</th><th>連対率</th><th>ラス回避</th></tr></thead>

function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function bindStats(){
  const upd=()=>render();
  document.getElementById("ffrom").onchange=e=>{filter.from=e.target.value;upd();};
  document.getElementById("fto").onchange=e=>{filter.to=e.target.value;upd();};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.f, v=b.dataset.v;
    if(k==="mode"){filter.mode=v;}
    else{ const val = k==="rates"?Number(v):v; const a=filter[k]; const i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); }
    upd();
  });
  document.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{const id=c.dataset.pick;const i=filter.pick.indexOf(id); c.checked? (i<0&&filter.pick.push(id)) : (i>=0&&filter.pick.splice(i,1)); upd();});
  document.getElementById("freset").onclick=()=>{filter={from:"",to:"",mode:"",rates:[],tags:[],members:[],pick:[]};upd();};
  document.getElementById("fsave").onclick=()=>{
    if(!unlocked()){document.getElementById("saveLock").hidden=false;return;}
    document.getElementById("saveBox").hidden=false;document.getElementById("saveName").focus();};
  document.getElementById("toSettings").onclick=()=>{tab="settings";render();};
  document.getElementById("saveOk").onclick=()=>{const name=document.getElementById("saveName").value.trim()||"保存した条件";db.saved.push({name,filter:JSON.parse(JSON.stringify(filter))});save();render();};
  document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{filter=JSON.parse(JSON.stringify(db.saved[b.dataset.load].filter));render();});
  if(typeof Chart==="undefined" || !document.getElementById("c1")) return;
  const sel=filterSessions(db.sessions,filter);
  const n = filter.mode? Number(filter.mode) : (sel.every(s=>s.rule.mode===3)&&sel.length?3:4);
  const st=playerStats(sel,n); const ids=Object.keys(st);
  const fg=cssv("--mute"), line=cssv("--line");
  Chart.defaults.color=fg; Chart.defaults.font.family=cssv("--font"); Chart.defaults.borderColor=line;
  const dates=[...new Set(sel.map(s=>s.date))].sort();
  charts.push(new Chart(document.getElementById("c1"),{type:"line",data:{labels:dates.map(d=>d.slice(5).replace("-","/")),
    datasets:ids.map(id=>{let last=0;const m=Object.fromEntries(st[id].hist.map(h=>[h.date,h.yen]));return {label:P(id).name,borderColor:P(id).color,backgroundColor:P(id).color,tension:.25,pointRadius:3,
      data:dates.map(d=>{if(d in m)last=m[d];return last;})};})},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}}},scales:{y:{ticks:{callback:v=>v.toLocaleString()+"P"}}}}}));
  const rc=[cssv("--r1"),cssv("--r2"),cssv("--r3"),cssv("--r4")];
  charts.push(new Chart(document.getElementById("c2"),{type:"bar",data:{labels:ids.map(id=>P(id).name),
    datasets:Array.from({length:n},(_,k)=>({label:(k+1)+"着",backgroundColor:rc[k],data:ids.map(id=>{const p=st[id];const g=p.dist.reduce((a,b)=>a+b,0)||1;return Math.round(p.dist[k]/g*100);})}))},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}}},scales:{x:{stacked:true},y:{stacked:true,max:100,ticks:{callback:v=>v+"%"}}}}}));
  const rates=[...new Set(sel.map(s=>Number(s.rule.rate)))].sort((a,b)=>a-b);
  charts.push(new Chart(document.getElementById("c3"),{type:"bar",data:{labels:rates.map(r=>r+"P/千点"),
    datasets:ids.map(id=>({label:P(id).name,backgroundColor:P(id).color,data:rates.map(r=>{const t=playerStats(sel.filter(s=>Number(s.rule.rate)===r),n)[id];return t?t.yen:0;})}))},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}}},scales:{y:{ticks:{callback:v=>v.toLocaleString()+"P"}}}}}));
}

function bindExtras(s){
  const add=document.getElementById("xAdd"); if(!add) return;
  add.onclick=()=>{
    const name=document.getElementById("xName").value.trim(), price=Number(document.getElementById("xPrice").value);
    if(!name||!price){document.getElementById("xErr").textContent="名前と数を入れてください";return;}
    s.extras=s.extras||[]; s.extras.push({id:uid(),name,price,counts:{}}); db.sample=false; save(); render();
  };
  document.querySelectorAll("[data-xp]").forEach(i=>{const x=s.extras.find(v=>v.id===i.dataset.xid);
    i.oninput=()=>{const n=parseSigned(i.value); if(n!==null){x.counts[i.dataset.xp]=n;save();}};

function bindSession(){
  const s=db.sessions.find(x=>x.id===openSession); if(!s) return;
  bindExtras(s);
  document.getElementById("back").onclick=()=>{openSession=null;render();};
  const inputs=[...document.querySelectorAll("[data-sc]")];
  const keepScores=()=>{resume.sc[s.id]=Object.fromEntries(inputs.map(i=>[i.dataset.sc,i.value])); keepResume();};
  inputs.forEach(i=>i.oninput=keepScores);
  document.getElementById("auto").onclick=()=>{const empty=inputs.filter(i=>i.value.trim()==="");if(empty.length!==1){document.getElementById("gErr").textContent="空いている欄が1つのときに使えます";return;}
    const vals=inputs.filter(i=>i.value.trim()!=="").map(i=>parseScore(i.value));
    if(vals.includes(null)){document.getElementById("gErr").textContent="読めない点数があります";return;}
    empty[0].value=String((s.rule.start*s.rule.mode-vals.reduce((a,b)=>a+b,0))/1000); keepScores();};
  document.getElementById("addG").onclick=()=>{
    if(inputs.some(i=>i.value.trim()==="")){document.getElementById("gErr").textContent="全員の点数を入れてください";return;}
    const scores=Object.fromEntries(inputs.map(i=>[i.dataset.sc,parseScore(i.value)]));
    if(Object.values(scores).includes(null)){document.getElementById("gErr").textContent="読めない点数があります";return;}
    const r=scoreGame(scores,s.rule,s.members);
    if(!r.ok){document.getElementById("gErr").textContent=`合計が${r.total.toLocaleString()}点です（${r.expected.toLocaleString()}点のはず）`;return;}
    s.games.push({scores}); db.sample=false; delete resume.sc[s.id]; save(); render();
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{s.games.splice(Number(b.dataset.del),1);save();render();});
  document.querySelectorAll("[data-chip]").forEach(i=>{
    i.oninput=()=>{const n=parseSigned(i.value); if(n!==null){s.chips=s.chips||{};s.chips[i.dataset.chip]=n;save();}};
    i.onchange=()=>{s.chips=s.chips||{};s.chips[i.dataset.chip]=parseSigned(i.value)||0;save();render();};});
  document.getElementById("delS").onclick=()=>{document.getElementById("delConfirm").hidden=false;};
  document.getElementById("delYes").onclick=()=>{db.sessions=db.sessions.filter(x=>x.id!==s.id);delete resume.sc[s.id];save();openSession=null;render();};
}

  </section>
  <section class="card"><details ${f.games.length?"":"open"}><summary>初期設定（店のルール）</summary><div class="stack" style="margin-top:8px">
    <div class="row">${[4,3].map(m=>`<button class="chip" data-fmode="${m}" aria-pressed="${r.mode===m}">${m===4?"四麻":"三麻"}</button>`).join("")}</div>
    <div class="grid2"><label class="f">持ち点<input inputmode="numeric" data-frule="start" value="${r.start}"></label><label class="f">返し<input inputmode="numeric" data-frule="ret" value="${r.ret}"></label></div>
    <label class="f">ウマ（上から順に、カンマ区切り）<input data-frule="uma" value="${r.uma.join(",")}"></label>
    <div class="grid2"><label class="f">千点あたり（P）<input inputmode="decimal" data-frule="rate" value="${r.rate}"></label><label class="f">チップ1枚（P）<input inputmode="decimal" data-frule="chipRate" value="${r.chipRate}"></label></div>
    <div class="grid2"><label class="f">ゲーム代（P）<input inputmode="decimal" data-frule="fee" value="${r.fee}"></label><label class="f">トップのゲーム代（同じなら空）<input inputmode="decimal" data-frule="feeTop" value="${r.feeTop}"></label></div>
    <span class="warn" id="fRuleErr"></span>
  </div></details></section>`;
}
function bindFree(){
  const f=freeState(), r=f.rule;
  const score=document.getElementById("fScore"), chip=document.getElementById("fChip");
  const paint=()=>{
    const out=document.getElementById("fOut"), sc=parseScore(score.value);
    if(sc===null){ out.textContent="-"; out.className="free-out"; return; }
    const x=freeResult(sc,freeRank,parseSigned(chip.value)||0,r);
    out.textContent=fmtP(x.total); out.className="free-out "+cls(x.total);
    document.getElementById("fDetail").textContent=`${sc.toLocaleString()}点・${freeRank}着：ポイント ${fmtPt(x.point)}${x.fee?`、ゲーム代 ${x.fee.toLocaleString()}P`:""}`;
  };
  const keepFree=()=>{resume.free={score:score.value,chip:chip.value,rank:freeRank}; keepResume();};
  score.oninput=chip.oninput=()=>{paint(); keepFree();};
  document.querySelectorAll("[data-frank]").forEach(b=>b.onclick=()=>{freeRank=Number(b.dataset.frank);
    document.querySelectorAll("[data-frank]").forEach(c=>c.setAttribute("aria-pressed",c===b)); paint(); keepFree();});
  document.getElementById("fAdd").onclick=()=>{
    const sc=parseScore(score.value);
    if(sc===null){document.getElementById("fErr").textContent="点数を入れてください";return;}
    f.games.push({id:uid(),date:today(),score:sc,rank:freeRank,chips:parseSigned(chip.value)||0,rule:JSON.parse(JSON.stringify(r))});
    resume.free={rank:freeRank}; save(); render();
  };
  document.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>{f.games=f.games.filter(g=>g.id!==b.dataset.fdel);save();render();});
  document.querySelectorAll("[data-fmode]").forEach(b=>b.onclick=()=>{Object.assign(r,FREE_RULES[b.dataset.fmode]);save();render();});
  document.querySelectorAll("[data-frule]").forEach(i=>i.onchange=()=>{
    const k=i.dataset.frule, msg=document.getElementById("fRuleErr"); msg.textContent="";
    if(k==="uma"){ const u=i.value.split(/[,、\s]+/).filter(Boolean).map(parseSigned);
      if(u.length!==r.mode||u.includes(null)){msg.textContent=`ウマは${r.mode}つ入れてください`;return;}
      r.uma=u; }
    else if(k==="feeTop"&&i.value.trim()==="") r.feeTop="";
    else{ const n=parseSigned(i.value); if(n===null){msg.textContent="数字を入れてください";return;} r[k]=n; }
    save(); paint();
  });
  paint();
}

  <div class="row"><input id="pName" placeholder="名前" style="flex:1"><button class="primary" id="pAdd">足す</button></div></section>`;

/* --- 設定 --- */
function csvRows(){
  const rows=[["日付","名前","場所","ルール","千点あたり(P)","半荘","メンバー","点数","着順","ポイント"]];
  db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.games.forEach((g,gi)=>{const r=scoreGame(g.scores,s.rule,s.members);
    s.members.forEach(id=>rows.push([s.date,s.title||"",(s.tags||[]).join(" "),s.rule.mode===3?"三麻":"四麻",s.rule.rate,gi+1,P(id).name,g.scores[id],r.res[id].rank,r.res[id].point]));}));
  return rows;
}
function settleRows(){
  const rows=[["日付","名前","場所","ルール","千点あたり(P)","メンバー","半荘数","ポイント","チップ","その他","ゲーム代","収支"]];
  db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const t=sessionTotals(s);
    s.members.forEach(id=>rows.push([s.date,s.title||"",(s.tags||[]).join(" "),s.rule.mode===3?"三麻":"四麻",s.rule.rate,P(id).name,t[id].games,t[id].point,t[id].chips,t[id].extra,t[id].fee,t[id].yen]));});
  return rows;
}
function stamp(){ return today().replace(/-/g,""); }
// スマホは共有の画面を出す。iPhone はここから「ファイル」に保存できる。やめたら "cancel"
async function saveFile(name,blob){
  const file=new File([blob],name,{type:blob.type.split(";")[0]});
  if(navigator.maxTouchPoints>0 && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return "done"; }
    catch(e){ if(e.name==="AbortError") return "cancel"; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  return "done";
}
const SAVED_MSG="保存しました。見つからないときは下の文字のコピーを使ってください";
async function saveBackup(){
  if(await saveFile(`hanchan-note-${stamp()}.json`,new Blob([JSON.stringify(db)],{type:"application/json"}))==="cancel") return;
  db.settings.backupAt=Date.now(); db.settings.backupGames=gameCount(db); save(); render();
  const m=document.getElementById("bkMsg"); if(m) m.textContent=SAVED_MSG;
}
const CSV_TYPE={type:"text/csv;charset=utf-8"};
function csvBlob(rows){ return new Blob(["﻿"+toCSV(rows)],CSV_TYPE); }
function loadXLSX(){ return window.XLSX?Promise.resolve():new Promise((ok,ng)=>{const t=document.createElement("script"); t.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; t.onload=ok; t.onerror=ng; document.head.appendChild(t);}); }
async function xlsxBlob(){
  await loadXLSX();
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(csvRows()),"半荘ごと");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(settleRows()),"精算");
  return new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function lockedNote(what){ return `<p class="note">${what}は拡張機能です。上の欄に解放コードを入れると使えます。</p>`; }
function viewUnlock(){
  if(unlocked()) return `<section class="card"><h2>拡張機能</h2><p class="note">バックアップ・条件の保存・CSV/Excel の書き出しが使えます。</p></section>`;
  return `<section class="card"><h2>拡張機能</h2>
    <p class="note">バックアップ・条件の保存・CSV/Excel の書き出しが使えるようになります。買い切りで月額はありません。販売ページは準備中です。</p>
    <div class="row"><input id="codeIn" placeholder="HN-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" style="flex:1"><button class="primary" id="codeOk">開く</button></div>
    <span class="warn" id="codeMsg"></span></section>`;
}
function viewSettings(){
  const easy=db.settings.mode==="easy", on=unlocked();
  const savedList=db.saved.map((sv,i)=>`<div class="item" style="cursor:default"><span>${esc(sv.name)}</span><button class="small ghost" data-sdel="${i}" aria-label="${esc(sv.name)}を消す">消す</button></div>`).join("");
  return `${viewUnlock()}
  <section class="card"><h2>入力のしかた</h2>
    <div class="row"><button class="chip" data-mode="easy" aria-pressed="${easy}">かんたん</button><button class="chip" data-mode="full" aria-pressed="${!easy}">くわしい</button></div>
    <p class="note">かんたん：ルールを選んで点数を入れるだけ。くわしい：持ち点・返し・ウマ・同点の扱いも自分で決める。</p></section>
  <section class="card"><h2>バックアップ${on?"":'<span class="lock">拡張</span>'}</h2>
    <p class="note">記録はこの端末の中だけにあります。ファイルに保存しておけば、機種変更でも戻せます。</p>
    ${on?`<p class="note">前回の保存：${db.settings.backupAt?fmtAt(db.settings.backupAt):"まだありません"}（保存していない記録 ${unsavedGames(db)}半荘）。iPhone は「ファイルに保存」を押して、出てきた画面で「"ファイル"に保存」を選びます。</p>`:""}
    ${on?`<div class="row"><button class="small primary" id="bkFile">ファイルに保存</button><span class="note" id="bkMsg"></span></div>
    <details><summary>ファイルに保存できないとき（文字でコピー）</summary><div class="stack" style="margin-top:8px"><textarea id="bk" readonly>${esc(JSON.stringify(db))}</textarea><div class="row"><button class="small" id="bkCopy">コピー</button></div></div></details>
    <details><summary>バックアップから戻す</summary><div class="stack" style="margin-top:8px">
      ${snaps.length?`<h3>自動の控え（この端末の中）</h3><p class="note">間違えて消したときに戻せます。端末が壊れたり機種変更したりすると一緒に無くなります。</p>
      <div class="list">${snaps.map((x,i)=>`<div class="item" style="cursor:default"><span class="num">${fmtAt(x.at)}</span><button class="small ghost" data-snap="${i}">これに戻す</button></div>`).join("")}</div>
      <h3>ファイルから</h3>`:""}
      <label class="f">バックアップのファイルを選ぶ<input type="file" id="rsFile" accept=".json,application/json"></label>
      <textarea id="rs" placeholder="または、コピーしておいた文字を貼る"></textarea>
      <div class="row"><button class="small" id="rsOk">読み取る</button><span class="warn" id="rsMsg"></span></div>
      <div class="row" id="rsConfirm" hidden><span class="note" id="rsInfo"></span><button class="small primary" id="rsYes">置き換える</button></div>
    </div></details>`:lockedNote("バックアップ")}
  </section>
  ${on&&db.saved.length?`<section class="card"><h2>保存した条件</h2><div class="list">${savedList}</div></section>`:""}
  <section class="card"><h2>CSV・Excel 書き出し${on?"":'<span class="lock">拡張</span>'}</h2>
    ${on?`<p class="note">全部の記録を出します。Excel は「半荘ごと」と「精算」の2枚のシートになります。</p>
    <div class="row"><button class="small primary" id="xlsxFile">Excel に保存</button><button class="small" id="csvFile">CSV（半荘ごと）</button><button class="small" id="csvFile2">CSV（精算）</button></div>
    <span class="note" id="csvMsg"></span>
    <details><summary>ファイルに保存できないとき（文字でコピー）</summary><div class="stack" style="margin-top:8px"><textarea id="csv" readonly>${esc(toCSV(csvRows()))}</textarea><div class="row"><button class="small" id="csvCopy">コピー</button></div></div></details>`:lockedNote("書き出し")}
  </section>
  <section class="card"><h2>このアプリについて</h2><p class="note">${ADS_ON?"広告は成績タブの下にだけ出ます。拡張機能を開くと消えます。":"広告はありません。"}登録は要りません。試作版のため、データの形は今後変わることがあります。作り：WhiteRasCAT</p><a class="note" href="privacy.html">データの扱いについて</a></section>`;
}
function bindUnlock(){
  const ok=document.getElementById("codeOk"); if(!ok) return;
  ok.onclick=()=>{ if(isValidCode(document.getElementById("codeIn").value)){db.settings.unlocked=true;save();render();} else document.getElementById("codeMsg").textContent="コードが違います。入力を確かめてください"; };
}
function bindBackup(){
  if(!unlocked()) return;
  document.getElementById("bkFile").onclick=saveBackup;
  const csvDone=r=>{ document.getElementById("csvMsg").textContent=r==="cancel"?"":SAVED_MSG; };
  document.getElementById("csvFile").onclick=async()=>csvDone(await saveFile(`hanchan-note-games-${stamp()}.csv`,csvBlob(csvRows())));
  document.getElementById("csvFile2").onclick=async()=>csvDone(await saveFile(`hanchan-note-settle-${stamp()}.csv`,csvBlob(settleRows())));
  document.getElementById("xlsxFile").onclick=async()=>{ const m=document.getElementById("csvMsg"); try{ csvDone(await saveFile(`hanchan-note-${stamp()}.xlsx`,await xlsxBlob())); }catch(e){ m.textContent="Excel の準備に失敗しました。電波のある所でもう一度試すか、CSV を使ってください"; } };
  copyBtn("bkCopy","bk","bkMsg"); copyBtn("csvCopy","csv","csvMsg");
  let pending=null;
  const read=text=>{ const msg=document.getElementById("rsMsg"), box=document.getElementById("rsConfirm"); msg.textContent=""; box.hidden=true;
    try{ const d=JSON.parse(text); if(!isBackup(d)) throw 0; pending=d;
      document.getElementById("rsInfo").textContent=`${d.sessions.length}件のセッションが入っています。いまの記録と置き換えます。`; box.hidden=false; }
    catch(e){ msg.textContent="読み取れませんでした。バックアップのファイルか、コピーした文字を全部入れてください"; } };
  document.querySelectorAll("[data-snap]").forEach(b=>b.onclick=()=>read(snaps[Number(b.dataset.snap)].text));
  document.getElementById("rsOk").onclick=()=>read(document.getElementById("rs").value);
  document.getElementById("rsFile").onchange=async e=>{ const f=e.target.files[0]; if(f) read(await f.text()); };
  document.getElementById("rsYes").onclick=()=>{ if(!pending) return;
    takeSnap(true);
    db={...pending,saved:pending.saved||[],sample:false,settings:{mode:"easy",...pending.settings,unlocked:true,noticeDone:true}}; save(); render(); };
  document.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=()=>{db.saved.splice(Number(b.dataset.sdel),1);save();render();});
}
function copyBtn(btn,area,msg){document.getElementById(btn).onclick=async()=>{const t=document.getElementById(area);try{await navigator.clipboard.writeText(t.value);document.getElementById(msg).textContent="コピーしました";}catch(e){t.select();document.getElementById(msg).textContent="選択しました。長押しでコピーしてください";}};}
function bindSettings(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{db.settings.mode=b.dataset.mode;save();render();});
  bindUnlock(); bindBackup();
}

(async()=>{
  db=await load();
  readResume();
  render();
  takeSnap();
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) takeSnap(); });
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
