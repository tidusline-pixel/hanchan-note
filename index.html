<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>半荘ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#4f6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="半荘ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* 層：上に条件バー → 数字 → グラフ → 一覧。下に固定のタブ。雀簿寄りのくすんだ緑と丸い角 */
:root{
  --bg:#f3f4ee; --card:#fbfbf7; --fg:#26302a; --mute:#6c776f; --line:#dde2d6;
  --accent:#4f6b55; --accent-weak:#e3ebe0; --plus:#2f6fb0; --minus:#c0443b; --gold:#b8892c;
  --r1:#4f6b55; --r2:#86a17c; --r3:#c9b77f; --r4:#c98a7a;
  --font:"Meiryo","メイリオ","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181c19; --card:#212722; --fg:#e7ebe4; --mute:#9aa59c; --line:#3a443b;
  --accent:#8fb293; --accent-weak:#2b362d; --plus:#7fb2e8; --minus:#ec8a80; --gold:#d9b25c;
  --r1:#8fb293; --r2:#5f7d5f; --r3:#a99a63; --r4:#a8695b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181c19; --card:#212722; --fg:#e7ebe4; --mute:#9aa59c; --line:#3a443b;
  --accent:#8fb293; --accent-weak:#2b362d; --plus:#7fb2e8; --minus:#ec8a80; --gold:#d9b25c;
  --r1:#8fb293; --r2:#5f7d5f; --r3:#a99a63; --r4:#a8695b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap,.card,.stack,.grid2>*,.grid3>*,.row>*{min-width:0}
input[type=date],input:not([type]),select{width:100%}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;letter-spacing:.04em}
header.top .sub{color:var(--mute);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.stack{display:grid;gap:12px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0;color:var(--mute);font-weight:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
button.primary{background:#4f6b55;color:#fff;border-color:#4f6b55}
button.wide{width:100%;min-height:48px;font-weight:bold}
button.ghost{background:transparent}
button.small{padding:3px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border-radius:999px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chip[aria-pressed="true"]{background:#4f6b55;color:#fff;border-color:#4f6b55;font-weight:bold}
.howto{margin:0;padding-left:18px}
.howtobox summary{font-size:14px;font-weight:700;color:var(--accent);min-height:32px;display:flex;align-items:center;gap:6px}
.howtobox summary::after{content:"閉じる";margin-left:auto;font-size:12px;font-weight:400;color:var(--mute)}
.howtobox:not([open]) summary::after{content:"開く"}
.howtobox .howto{margin-top:2px}
.howtobox summary h2{margin:0}
.tourblock{position:fixed;inset:0;z-index:20}
.tourspot{position:fixed;z-index:21;border-radius:12px;outline:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.62);pointer-events:none}
.tourbox{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:22;max-width:420px;margin:0 auto;background:var(--card);color:var(--fg);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.tourbox h2{margin:0;font-size:16px}
.tourbox p{margin:0;font-size:14px;line-height:1.6}
nav.tabs button{white-space:nowrap;overflow:hidden}
@media (max-width:350px){nav.tabs{padding-inline:2px}nav.tabs button{font-size:10px;letter-spacing:-.04em}}
.seg{display:flex;gap:6px}.seg .chip{flex:1;padding:0 6px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--accent-weak);color:var(--accent);vertical-align:1px}
.nextrow td{color:var(--mute)}
.pt{font-size:12px}
.totalrow td{font-weight:700;border-top:2px solid var(--line)}
.unitnote{background:var(--accent-weak);border-radius:10px;padding:8px 12px;font-size:14px;margin:0}
.unitnote b{color:var(--accent)}
.rulebox{background:var(--accent-weak);border-radius:10px;padding:8px 12px;font-size:14px}
.rulebox b{color:var(--accent)}
.tag.set{background:transparent;border:1px solid var(--line);color:var(--mute)}
.undobar{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;max-width:688px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:6px 8px 6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.undobar button{min-height:40px;background:transparent;color:inherit;border-color:currentColor}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:11px;color:var(--mute)}
.cal button{border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 0;min-height:56px;display:grid;grid-template-rows:14px 16px 8px;justify-items:center;align-items:center;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden}
.cal .d{font-size:11px;color:var(--mute)}
.cal .v{font-size:10.5px;font-weight:bold;letter-spacing:-.03em;white-space:nowrap}
.cal .m{display:flex;gap:3px}
.cal .m i{width:6px;height:6px;background:var(--mute);display:block}.cal .m i.free{border-radius:50%}
.cal .today{border-color:var(--accent)}.cal .sel{background:var(--accent-weak)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
input,select,textarea{font-size:16px}
input[type=number]{width:100%;text-align:right;font-variant-numeric:tabular-nums}
label.f,div.f{display:grid;gap:2px;font-size:12px;color:var(--mute)}
.chip.tiny{min-height:26px;padding:2px 8px;font-size:11px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{font-variant-numeric:tabular-nums}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:normal;color:var(--mute);font-size:12px}
.note{color:var(--mute);font-size:12px}
.warn{color:var(--minus);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1.25fr .8fr .8fr 1.5fr .75fr .75fr;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:none;background:transparent;border-radius:10px;padding:6px 0;display:grid;gap:0;justify-items:center;font-size:11px;color:var(--mute);min-height:48px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-weak)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.item .meta{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chartbox{position:relative;height:220px}
.sfield{display:flex;gap:4px;align-items:stretch}
.sfield input{flex:1;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.chipf{display:flex;flex-wrap:wrap;gap:4px}
.chipf .sfield{flex:1 1 120px;min-width:0}
.steps{display:flex;gap:4px}
.steps button{min-width:40px;min-height:44px;padding:0;border-radius:10px;font-size:14px;background:var(--accent-weak);color:var(--accent);border-color:var(--line);touch-action:manipulation}
.sfield .pm{min-width:44px;min-height:44px;padding:0 11px;border-radius:10px;font-size:18px;line-height:1;background:var(--accent-weak);color:var(--accent);border-color:var(--line)}
.free-out{font-size:32px;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums}
.adbox{margin-top:12px;display:grid;justify-items:center;gap:2px}
.adbox iframe{border:0;width:300px;height:250px;max-width:100%}
.lock{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 6px;margin-left:6px}
textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px}
.sample{background:var(--accent-weak);color:var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>半荘ノート</h1><div class="sub">麻雀の点数・精算・成績 <span class="badge">試作版</span></div></div>
  </header>
  <main id="view" class="stack"></main>
  <aside id="adBox" class="adbox" aria-label="広告" hidden></aside>
</div>

<nav class="tabs" aria-label="画面の切り替え">
  <button data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>セッション</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>セット</button>
  <button data-tab="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h1M12 12h1M15 12h.5M8.5 16h1M12 16h1M15 16h.5"/></svg>フリー</button>
  <button data-tab="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 3.9 1.8 4.5 4.5"/></svg>ルール/メンバ</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>成績</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>設定</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="core.js"></script>

<script>
const ADS_ON=false; // 広告を出すときだけ true。中身は frame.html
/* ===== 保存（この端末の中だけ） ===== */
const KEY="jakuroku-v1";
const uid=()=>Math.random().toString(36).slice(2,9);
let db, idb=null, saveBroken=false;
function sample(){
  const P=[["りょう","#4f6b55"],["しょう","#2f6fb0"],["なおき","#c0443b"],["ゆう","#b8892c"]].map(([name,color])=>({id:uid(),name,color,sample:true}));
  const [a,b,c,d]=P.map(p=>p.id);
  const mk=(date,title,tags,preset,members,games,chips,rate)=>{const rule={...RULE_PRESETS[preset]}; if(rate)rule.rate=rate;
    return {id:uid(),date,title,tags,rule,members,games:games.map(g=>({scores:Object.fromEntries(members.map((m,i)=>[m,g[i]]))})),chips:Object.fromEntries(members.map((m,i)=>[m,chips[i]])),sample:true,sampleN:games.length};};
  const S=[
    mk("2026-10-04","見本の会",["家"],"m4",[a,b,c,d],[[42000,31000,17000,10000],[25000,38000,22000,15000],[39000,27000,21000,13000]],[0,0,0,0],50),
  ];
  return {players:P,sessions:S,saved:[],settings:{unlocked:false},sample:true};
}
function idbOpen(){ return new Promise((ok,ng)=>{const r=indexedDB.open("hanchan-note",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);}); }
function idbDo(mode,fn){ return new Promise((ok,ng)=>{const tx=idb.transaction("kv",mode); const q=fn(tx.objectStore("kv")); tx.oncomplete=()=>ok(q.result); tx.onerror=tx.onabort=()=>ng(tx.error);}); }
// IndexedDB を先に見る。前の版の localStorage に記録があれば引き継ぐ
async function load(){
  let v=null, ls=null;
  try{ idb=await idbOpen(); v=await idbDo("readonly",s=>s.get("db")); snaps=await idbDo("readonly",s=>s.get("snaps"))||[]; }catch(e){ idb=null; }
  try{ ls=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(v && (!ls || (ls.savedAt||0)<=(v.savedAt||0))) return v;
  if(ls){ db=ls; save(); return ls; }
  return sample();
}
let saveQueue=Promise.resolve(), snaps=[];
// 落ちても失わないよう、その場で localStorage にも書く。起動のときは新しいほうを使う
function save(){
  db.savedAt=Date.now();
  const text=JSON.stringify(db);
  let kept=false; try{ localStorage.setItem(KEY,text); kept=true; }catch(e){}
  saveQueue=saveQueue.then(async()=>{
    try{ if(!idb) throw 0; await idbDo("readwrite",s=>s.put(JSON.parse(text),"db")); }
    catch(e){ if(!kept){ saveBroken=true; render(); } }
  });
}
function takeSnap(force){
  const next=nextSnaps(snaps,db,Date.now(),force);
  if(next===snaps||!idb) return;
  snaps=next;
  saveQueue=saveQueue.then(()=>idbDo("readwrite",s=>s.put(next,"snaps"))).catch(()=>{});
}
// 開いていた画面と入れかけの数字。アプリが落ちても、開き直せば続きから入れられる
const RESUME="hanchan-resume";
let resume={sc:{},free:{}};
function readResume(){
  try{ resume={...resume,...JSON.parse(localStorage.getItem(RESUME))}; }catch(e){}
  if(["stats","sessions","set","free","players","settings"].includes(resume.tab)) tab=resume.tab;
  openSession=resume.open||null;
  freeRank=resume.free.rank||1; freeTobi=!!resume.free.tobi;
}
function keepResume(){ try{ localStorage.setItem(RESUME,JSON.stringify({...resume,tab,open:openSession})); }catch(e){} }
const unlocked=()=>isUnlocked(db.settings);
const P=id=>db.players.find(p=>p.id===id)||{name:"?",color:"#888"};
const fmtAt=t=>new Date(t+9*3600e3).toISOString().slice(0,16).replace("T"," ");
const fmtP=v=>v===0?"±0P":(v>0?"+":"")+v.toLocaleString("ja-JP")+"P";
const fmtPt=v=>(v>0?"+":"")+v.toFixed(1);
const cls=v=>v>0?"plus":v<0?"minus":"";
const pct=v=>(v*100).toFixed(0)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);

/* ===== 画面 ===== */
let tab="sessions", openSession=null, charts=[];
let filter={from:"",to:"",mode:"",rates:[],tags:[],members:[],pick:[]};
const view=document.getElementById("view");
// スマホの数字キーには「-」が無いので、欄の横のボタンでマイナスにする
const sfield=(attrs,val="")=>`<span class="sfield"><button type="button" class="pm" data-pm aria-label="マイナスにする">−</button><input inputmode="decimal" autocomplete="off" ${attrs} value="${esc(val)}"></span>`;
// 画面の頭の使い方。閉じたらその画面は閉じたままにする
const chipField=(attrs,val="")=>`<span class="chipf">${sfield(attrs,val)}<span class="steps">${[-5,-1,1,5].map(n=>`<button type="button" data-step="${n}" aria-label="${n>0?"+":"−"}${Math.abs(n)}枚">${n>0?"+":"−"}${Math.abs(n)}</button>`).join("")}</span></span>`;
const HOW={
  sessions:["「＋ セットを記録」か「＋ フリーを記録」を押す","行を押すと開いて、直したり消したりできる","一覧とカレンダーを切り替えて見る（細かい集計は成績のタブ）"],
  set:["「＋ 新しく始める」でルールとメンバーを選ぶ","半荘ごとに点数を入れて「記録する」","終わったらチップと場代を入れて「このセッションを記録する」"],
  free:["四麻か三麻を選ぶ（ルールは最初に一度決めるだけ）","着順を押して、点数を入れる","「記録する」で今日の合計が出る"],
  players:["ルールを選んで「セットで使う」か「フリーで使う」を押す","一緒に打つ人を「メンバーを追加」で入れる","自分の行の「自分」を押すと、集計の対象になる"],
  stats:["期間やレート、メンバーなどを選ぶ（何も選ばなければ全部）","下の表とグラフが選んだ条件で変わる","フリーの成績は上、セットの成績はその下に出る"],
};
const howBox=k=>`<details class="howtobox" data-howto="${k}" ${(db.settings.howClosed||{})[k]?"":"open"}><summary>【使い方】</summary><ol class="note howto">${HOW[k].map(x=>`<li>${x}</li>`).join("")}</ol></details>`;
view.addEventListener("toggle",e=>{ const k=e.target.dataset&&e.target.dataset.howto; if(!k) return; const c=db.settings.howClosed=db.settings.howClosed||{}; if(!!c[k]===!e.target.open) return; c[k]=!e.target.open; save(); },true);
// 欄を入れた直後に押しても、欄を離れたときの描き直しでボタンが空振りしないようにする
view.addEventListener("mousedown",e=>{ if(e.target.closest("[data-step],[data-pm]")) e.preventDefault(); });
view.addEventListener("click",e=>{
  const st=e.target.closest("[data-step]"); if(!st) return;
  e.preventDefault();
  const i=st.closest(".chipf").querySelector("input");
  i.value=String(Math.round(((parseSigned(i.value)||0)+Number(st.dataset.step))*10)/10);
  i.dispatchEvent(new Event("input",{bubbles:true}));
  i.dispatchEvent(new Event("change",{bubbles:true}));
});
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-pm]"); if(!b) return;
  e.preventDefault();
  const i=b.parentNode.querySelector("input"), body=i.value.replace(/[-−ー▲△\s]/g,"");
  i.value=/[-−ー▲△]/.test(i.value)?body:"-"+body;
  i.dispatchEvent(new Event("input",{bubbles:true}));
  if(body) i.dispatchEvent(new Event("change",{bubbles:true})); else i.focus();
});

// 消す・直すは確認を出さず、8秒だけ「元に戻す」を出す。戻すのは操作の前の記録全体

const inBrowser=()=>/iPhone|iPad|Android/.test(navigator.userAgent)&&!navigator.standalone&&!matchMedia("(display-mode: standalone)").matches;
let browserWarned=false;
function warnBrowser(){ if(browserWarned||!inBrowser()) return; browserWarned=true; toast("ブラウザのままです。記録が消えやすいので、ホーム画面に追加して使ってください"); }
function toast(msg){ const old=document.getElementById("toast"); if(old) old.remove(); const t=document.createElement("div"); t.className="undobar"; t.id="toast"; t.style.minHeight="48px"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),5000); }
// 初めて消すときだけ、確認は設定で消せると伝える
function askDel(msg){ if(db.settings.delAsk===false) return true;
  const hint=db.settings.delHintDone?"":"\n\nこの確認は、設定の「入力」で出さないようにできます。";
  const yes=confirm(msg+hint); if(hint){db.settings.delHintDone=true;save();} return yes; }
function undoable(label,fn){
  const before=JSON.stringify(db);
  fn(); save(); undo={label,before};
  clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{undo=null;const u=document.getElementById("undoBar");if(u)u.remove();},8000);
  render();
}
// 最初の案内。タブを順に光らせる。記録には触らず、続きは設定の使い方へつなぐ
const TOUR=[

let tourAt=-1;
function tourEnd(howto){
  tourAt=-1; removeEventListener("resize",tourPlace);
  ["tourBlock","tourSpot","tourBox"].forEach(id=>{const x=document.getElementById(id);if(x)x.remove();});
  tab=howto?"settings":"sessions"; openSession=null; render();

}
function tourPlace(){
  const r=document.querySelector(`nav.tabs [data-tab="${TOUR[tourAt][0]}"]`).getBoundingClientRect(), s=document.getElementById("tourSpot");
  Object.assign(s.style,{left:r.left+2+"px",top:r.top+2+"px",width:r.width-4+"px",height:r.height-4+"px"});
}
function tourShow(i){
  tourAt=i; const [t,h,p]=TOUR[i], last=i===TOUR.length-1;
  tab=t; openSession=null; render(); window.scrollTo(0,0);
  tourPlace();
  const b=document.getElementById("tourBox");
  b.innerHTML=`<span class="note">${i+1} / ${TOUR.length}</span><h2>${h}</h2><p>${p}</p><div class="row between"><button class="small ghost" id="tourSkip">${last?"おわる":"とばす"}</button><button class="small primary" id="tourNext">${last?"使い方を見る":"次へ"}</button></div>`;
  document.getElementById("tourSkip").onclick=()=>tourEnd(false);
  document.getElementById("tourNext").onclick=()=>last?tourEnd(true):tourShow(i+1);

}
function tourStart(){
  document.body.insertAdjacentHTML("beforeend",`<div class="tourblock" id="tourBlock"></div><div class="tourspot" id="tourSpot"></div><div class="tourbox" id="tourBox" role="dialog" aria-label="最初の案内"></div>`);

}
function render(){
  keepResume();
  charts.forEach(c=>c.destroy()); charts=[];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab));
  const banner = hasSample(db) ? `<div class="sample"><span>いま入っているのは見本のデータです</span><button class="small" id="clearSample">見本を消して始める</button></div>`:"";
  const notice = db.settings.noticeDone ? "" : `<div class="sample"><span>記録はこの端末の中だけに残ります。iPhone はホーム画面に追加して使ってください。機種変更やブラウザのデータ削除で消えるので、残したいときはバックアップ（拡張機能）を使ってください。使い方は設定にあります。</span><button class="small" id="noticeOk">わかった</button></div>`;
  const broken = saveBroken ? `<p class="warn">記録を保存できませんでした。端末の空き容量を確かめてください。</p>`:"";
  const due = unlocked() && (tab==="stats"||(tab==="sessions"&&!openSession)) && backupDue(db) ? `<div class="sample"><span>ファイルに保存していない記録が ${unsavedGames(db)}半荘あります</span><span class="row"><button class="small ghost" id="bkLater">あとで</button><button class="small" id="bkDue">保存する</button></span><span id="bkMsg" style="flex-basis:100%"></span></div>`:"";
  const until=db.settings.unlockUntil, left=until?Math.ceil((until-Date.now())/864e5):0;
  const expiry = unlocked() && until && left<=14 && (left<=3||!db.settings.expirySkip) && (tab==="stats"||(tab==="sessions"&&!openSession)) ? `<div class="sample"><span>${db.settings.trial?"試用":"コード"}の期限はあと${left}日です（${new Date(until-1).toISOString().slice(0,10)}まで）。先にバックアップを保存してください</span><span class="row">${left>3?'<button class="small ghost" id="expLater">あとで</button>':""}<button class="small" id="expSave">保存する</button></span>${due?"":'<span id="bkMsg" style="flex-basis:100%"></span>'}</div>`:"";
  const undoBar = undo ? `<div class="undobar" id="undoBar"><span>${esc(undo.label)}</span><button class="small" id="undoBtn">元に戻す</button></div>`:"";
  // 前の URL で開いた人に新しい URL を知らせる。記録は URL ごとに分かれるので自動では移らない
  const moved = location.hostname.endsWith(".github.io")&&location.hostname!=="hanchan-note.github.io" ? `<div class="sample" id="movedBar"><span>半荘ノートの URL が変わりました。<a href="https://hanchan-note.github.io/">新しい URL</a> で開き直してください。記録は自動では移らないので、バックアップを保存して、新しい URL で戻してください。</span></div>`:"";
  view.innerHTML = moved + broken + notice + expiry + due + (tab==="free"?"":banner) + undoBar + ({stats:viewStats,sessions:viewSessions,set:viewSet,free:viewFree,players:viewPlayers,settings:viewSettings}[tab])();
  const cs=document.getElementById("clearSample"); if(cs) cs.onclick=()=>undoable("見本を消しました",()=>clearSample(db));
  const ub=document.getElementById("undoBtn"); if(ub) ub.onclick=()=>{db=JSON.parse(undo.before);undo=null;save();render();};
  const bd=document.getElementById("bkDue"); if(bd){ bd.onclick=saveBackup; document.getElementById("bkLater").onclick=()=>{db.settings.nudgeSkip=gameCount(db);save();render();}; }
  const ex=document.getElementById("expSave"); if(ex){ ex.onclick=saveBackup; const lt=document.getElementById("expLater"); if(lt) lt.onclick=()=>{db.settings.expirySkip=true;save();render();}; }
  const no=document.getElementById("noticeOk"); if(no) no.onclick=()=>{db.settings.noticeDone=true;save();tourStart();};
  const ta=document.getElementById("tourAgain"); if(ta) ta.onclick=tourStart;
  ({stats:bindStats,sessions:bindSessions,set:bindSet,free:bindFree,players:bindPlayers,settings:bindSettings}[tab])();
  showAd();
}
// 成績タブの下にだけ出す。読み直しで表示回数が増えないよう、枠は1回だけ作る。記録に触れないよう隔離する

/* --- 成績 --- */
function allRates(){ return [...new Set([...db.sessions.map(s=>Number(s.rule.rate)),...freeState().games.map(g=>Number(g.rule.rate))])].sort((a,b)=>a-b); }
function allTags(){ return [...new Set(db.sessions.flatMap(s=>s.tags||[]))]; }
const PICK_SHOW=6, fOpen={};
// 着順は人数が違うと比べられないので、四麻と三麻に分けて出す
const statModes=sel=>[...new Set(sel.map(s=>s.rule.mode))].sort((a,b)=>b-a);
const modeName=m=>m===3?"三麻":"四麻";
const rateName=r=>`レート${Number(r)/100}`;
const statSel=()=>filter.kind==="free"?[]:filterSessions(db.sessions,filter);
const freeSel=()=>filter.kind==="set"?[]:filterFree(freeState().games,filter);
function freeStatsCard(){
  const fs=freeSel();
  if(!fs.length) return filter.kind!=="set"&&freeState().games.length&&(filter.tags.length||filter.members.length||filter.pick.length)?`<p class="note">場所・メンバー・セッションを選んでいるので、フリーは集計に入っていません。</p>`:"";
  const row=m=>{const x=freeSummary(fs.filter(g=>g.rule.mode===m)); return x.games?`<tr><td>${modeName(m)}</td><td class="${cls(x.total)}">${fmtP(x.total)}</td><td class="${cls(x.point)}">${fmtPt(x.point)}</td><td>${x.games}</td><td>${x.avgRank.toFixed(2)}</td><td>${pct(x.top)}</td><td>${pct(x.lastAvoid)}</td></tr>`:"";};
  const rankRow=m=>{const ms=fs.filter(g=>g.rule.mode===m); return ms.length?`<tr><td>${modeName(m)}</td>${[1,2,3,4].map(k=>{if(k>m)return "<td>-</td>"; const n=ms.filter(g=>g.rank===k).length; return `<td>${n}回<br><span class="pt">${pct(n/ms.length)}</span></td>`;}).join("")}</tr>`:"";};
  return `<section class="card"><h2>フリーの成績</h2><div class="tablebox"><table><thead><tr><th>種類</th><th>収支</th><th>ポイント</th><th>半荘</th><th>平均着順</th><th>トップ率</th><th>ラス回避</th></tr></thead><tbody>${row(4)}${row(3)}</tbody></table></div>
    <h3>着順の回数</h3><div class="tablebox"><table id="fRanks"><thead><tr><th>種類</th><th>1着</th><th>2着</th><th>3着</th><th>4着</th></tr></thead><tbody>${rankRow(4)}${rankRow(3)}</tbody></table></div></section>`;
}
// 成績を1枚の画像にする。画面の色の設定によらず明るい紙の色で描く
function summaryCanvas(sel){
  const W=1080, pad=56, rowH=62, st=playerStats(sel,4), ids=Object.keys(st).sort((a,b)=>st[b].yen-st[a].yen);
  const modes=statModes(sel).map(m=>{const x=playerStats(sel.filter(s=>s.rule.mode===m),m); return {m,x,ids:Object.keys(x).filter(id=>x[id].games).sort((a,b)=>x[a].avgRank-x[b].avgRank)};});
  const dates=[...new Set(sel.map(s=>s.date))].sort(), hasChart=dates.length>1, chartH=hasChart?440:0;
  const c=document.createElement("canvas"); c.width=W;
  c.height=190+rowH*(ids.length+1)+chartH+modes.reduce((a,x)=>a+100+rowH*(x.ids.length+1),0)+90;
  const g=c.getContext("2d"), FG="#26302a", MUTE="#6c776f", LINE="#dde2d6", PLUS="#2f6fb0", MINUS="#c0443b";
  g.fillStyle="#fbfbf7"; g.fillRect(0,0,W,c.height); g.textBaseline="middle";
  const text=(s,x,y,px,o={})=>{ g.font=`${o.bold?"bold ":""}${px}px Meiryo,"メイリオ","Hiragino Sans",sans-serif`; g.fillStyle=o.color||FG; g.textAlign=o.align||"left";
    let t=String(s); if(o.max&&g.measureText(t).width>o.max){ while(t.length>1&&g.measureText(t+"…").width>o.max) t=t.slice(0,-1); t+="…"; } g.fillText(t,x,y); };
  const yenColor=v=>v>0?PLUS:v<0?MINUS:FG, rule=y=>{ g.strokeStyle=LINE; g.lineWidth=2; g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke(); };
  const table=(y,cols,rows)=>{ cols.forEach(k=>text(k.t,k.x,y+rowH/2,26,{color:MUTE,align:k.a})); rule(y+rowH);
    rows.forEach((r,i)=>{ const yy=y+rowH*(i+1); r.forEach((v,j)=>{ const k=cols[j]; text(v.t??v,k.x,yy+rowH/2,30,{align:k.a,color:v.c,bold:v.b,max:k.max}); }); rule(yy+rowH); });
    return y+rowH*(rows.length+1); };
  text("成績まとめ",pad,82,56,{bold:true});
  const span=dates[0]===dates[dates.length-1]?dates[0]:`${dates[0]} 〜 ${dates[dates.length-1]}`;
  text(`${span}　${sel.length}回 ${sel.reduce((a,s)=>a+s.games.length,0)}半荘`,pad,146,30,{color:MUTE});
  let y=table(190,[{t:"名前",x:pad,max:400},{t:"収支",x:760,a:"right"},{t:"ポイント",x:920,a:"right"},{t:"半荘",x:W-pad,a:"right"}],
    ids.map(id=>[{t:P(id).name,b:true,c:P(id).color},{t:fmtP(st[id].yen),c:yenColor(st[id].yen),b:true},{t:fmtPt(st[id].point),c:yenColor(st[id].point)},st[id].games]));
  if(hasChart){ const top=y+120, bot=y+chartH-40, L=pad+10, R=W-pad-10;
    const series=ids.map(id=>{ let v=0; return {id,pts:dates.map(d=>{ st[id].hist.filter(h=>h.date===d).forEach(h=>{v=h.yen;}); return v; })}; });
    const all=[0,...series.flatMap(x=>x.pts)], hi=Math.max(...all), lo=Math.min(...all), Y=v=>hi===lo?(top+bot)/2:bot-(v-lo)/(hi-lo)*(bot-top), X=i=>L+i*(R-L)/(dates.length-1);
    text("収支の動き",pad,y+56,30,{bold:true}); text(fmtP(hi),R,top-28,24,{color:MUTE,align:"right"}); text(fmtP(lo),R,bot+16,24,{color:MUTE,align:"right"});
    g.strokeStyle=MUTE; g.lineWidth=2; g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(R,Y(0)); g.stroke();
    series.forEach(x=>{ g.strokeStyle=P(x.id).color; g.lineWidth=5; g.lineJoin="round"; g.beginPath(); x.pts.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.stroke(); });
    y+=chartH; }
  modes.forEach(({m,x,ids:mi})=>{ text(`着順（${modeName(m)}）`,pad,y+60,30,{bold:true});
    y=table(y+100,[{t:"名前",x:pad,max:400},{t:"半荘",x:560,a:"right"},{t:"平均",x:700,a:"right"},{t:"トップ",x:860,a:"right"},{t:"ラス回避",x:W-pad,a:"right"}],
      mi.map(id=>[{t:P(id).name,c:P(id).color,b:true},x[id].games,x[id].avgRank.toFixed(2),pct(x[id].top),pct(x[id].lastAvoid)])); });
  text("半荘ノート",W-pad,c.height-44,26,{color:MUTE,align:"right"});
  return c;
}

    ${s.venue&&s.venue.amount&&venueFlips(t)?`<p class="warn">${s.venue.how==="top"?"トップが払うと収支の順番が入れ替わります。「勝ち額で」なら、順番は変わりません。":"場代を引くと収支の順番が入れ替わります。分け方を確かめてください。"}</p>`:""}
    <div class="tablebox"><table><thead><tr><th>名前</th><th>ポイント</th><th>チップ</th>${hasExtra?"<th>その他</th>":""}<th>場代</th><th>収支</th></tr></thead><tbody>
    ${s.members.map(id=>`<tr><td><span class="dot" style="background:${P(id).color}"></span>${esc(P(id).name)}</td><td class="${cls(t[id].point)}">${fmtPt(t[id].point)}</td><td>${t[id].chips}</td>${hasExtra?`<td class="${cls(t[id].extra)}">${t[id].extra.toLocaleString()}</td>`:""}<td>${t[id].fee}</td><td class="${cls(t[id].yen)}"><b>${fmtP(t[id].yen)}</b></td></tr>`).join("")}
    </tbody></table></div>
    ${s.games.length?`<h3>着順の回数</h3><div class="tablebox"><table id="sRanks"><thead><tr><th>名前</th>${Array.from({length:s.rule.mode},(_,k)=>`<th>${k+1}着</th>`).join("")}<th>半荘</th></tr></thead><tbody>${s.members.map(id=>`<tr><td>${esc(P(id).name)}</td>${rankDist(t[id].spans,s.rule.mode).map(x=>`<td>${round1(x)}</td>`).join("")}<td>${t[id].games}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="list">${pay.map(x=>`<div class="item" style="cursor:default"><span>${esc(P(x.from).name)} → ${esc(P(x.to).name)}</span><b class="num">${x.yen.toLocaleString()}P</b></div>`).join("")||'<span class="note">まだ精算はありません</span>'}</div>
    ${fee||(s.venue&&s.venue.amount)?`<p class="note">場代は店へ払う分なので、人の間の精算には入れず、収支からだけ引いています。</p>`:""}
    ${gap?`<p class="warn">やり取りの合計が ${gap.toLocaleString()}Pずれています。チップやその他の項目の回数を確かめてください。</p>`:""}
    ${s.games.length?`<button class="wide" id="sShare">精算を共有（LINE など）</button><textarea id="shareBox" readonly hidden rows="8"></textarea>`:""}
    ${editGame===null?`<button class="primary wide" id="sDone">このセッションを記録する</button>`:""}
    <details><summary>日付・場所・ルールを直す</summary><div class="stack" style="margin-top:8px">
      <div class="grid2"><label class="f">日付<input type="date" id="sDate" value="${s.date}"></label><label class="f">場所<input id="sTags" value="${esc((s.tags||[]).join(" "))}"></label></div>
      ${s.title?`<label class="f">名前（前に入れた分）<input id="sTitle" value="${esc(s.title)}"></label>`:`<input type="hidden" id="sTitle" value="">`}
      <div class="grid3"><label class="f">千点あたり（P）<input inputmode="decimal" id="sRate" value="${s.rule.rate}"></label><label class="f">チップ1枚（P）<input inputmode="decimal" id="sChipR" value="${s.rule.chipRate}"></label><label class="f">ゲーム代（P）<input inputmode="decimal" id="sFee" value="${s.rule.fee||0}"></label></div>
      <div class="grid3"><label class="f">持ち点<input inputmode="numeric" id="sStart" value="${s.rule.start}"></label><label class="f">返し<input inputmode="numeric" id="sRet" value="${s.rule.ret}"></label><label class="f">ウマ<input id="sUma" value="${s.rule.uma.join(",")}"></label></div>
      <label class="f">千点未満の端数<select id="sRound">${roundOpts(s.rule.round)}</select></label>
      ${s.rule.tobi?`<label class="f">ダブル飛ばし<select id="sDouble">${doubleOpts(s.rule.tobiDouble)}</select></label>`:""}
      <button class="small primary" id="sSave">直す</button><span class="warn" id="sErr"></span>
      ${swapHTML(s)}
    </div></details>
    <div class="row"><button class="small ghost" id="delS">このセッションを消す</button><span id="delConfirm" hidden><button class="small" id="delYes">本当に消す</button></span></div>
  </section>`;
}
function extrasCard(s){
  const items=(s.extras||[]).map(x=>{const off=round1(extraGap(x));return `<div class="stack">
    <div class="row between"><b>${esc(x.name)}</b><span class="row"><span class="note">1回 ${Number(x.price).toLocaleString()}P</span><button class="small ghost" data-xdel="${x.id}" aria-label="${esc(x.name)}を消す">消す</button></span></div>
    <div class="grid2">${s.members.map(id=>`<label class="f">${esc(P(id).name)}${sfield(`data-xid="${x.id}" data-xp="${id}"`,(x.counts||{})[id]??0)}</label>`).join("")}</div>
    ${off?`<p class="warn">回数の合計が ${off}回です。もらう人と払う人が釣り合っていません（差し入れなど、わざとならそのままで大丈夫です）。</p>`:""}
  </div>`;}).join("");
  const body=`<p class="note">祝儀・焼き鳥・トビ賞など。もらう人はプラス、払う人はマイナスの回数を入れます。</p>
    ${items}
    <div class="grid2"><label class="f">項目の名前<input id="xName" placeholder="例：トビ賞"></label><label class="f">1回あたり（P）<input type="number" inputmode="numeric" id="xPrice" placeholder="例 1000"></label></div>
    <div class="row"><button class="small" id="xAdd">項目を足す</button><span class="warn" id="xErr"></span></div>`;
  return items?`<section class="card"><h2>その他の項目</h2>${body}</section>`:`<section class="card"><details><summary>その他の項目を足す</summary><div class="stack" style="margin-top:8px">${body}</div></details></section>`;
}
function bindExtras(s){
  const add=document.getElementById("xAdd"); if(!add) return;
  add.onclick=()=>{
    const name=document.getElementById("xName").value.trim(), price=Number(document.getElementById("xPrice").value);
    if(!name||!price){document.getElementById("xErr").textContent="名前と数を入れてください";return;}
    s.extras=s.extras||[]; s.extras.push({id:uid(),name,price,counts:{}}); db.sample=false; save(); render();
  };
  document.querySelectorAll("[data-xp]").forEach(i=>{const x=s.extras.find(v=>v.id===i.dataset.xid);
    i.oninput=()=>{const n=parseSigned(i.value); if(n!==null){x.counts[i.dataset.xp]=n;save();}};
    i.onchange=()=>{x.counts[i.dataset.xp]=parseSigned(i.value)||0; save(); render();};});
  document.querySelectorAll("[data-xdel]").forEach(b=>b.onclick=()=>undoable("項目を消しました",()=>{s.extras=s.extras.filter(v=>v.id!==b.dataset.xdel);}));
}
function bindSession(){
  const s=db.sessions.find(x=>x.id===openSession); if(!s) return;
  bindExtras(s);
  document.getElementById("back").onclick=()=>{openSession=null;editGame=null;render();window.scrollTo(0,0);};
  const all=[...document.querySelectorAll("[data-sc]")];
  // 4人で回す三麻は抜ける人の欄を隠す。入れかけの数字は残しておく
  let out=s.members.length<=s.rule.mode?null:editGame!==null?outOf(s,s.games[editGame]):(resume.sc[s.id]||{})._out||nextOut(s);
  const live=()=>all.filter(i=>i.dataset.sc!==out);
  const gcs=[...document.querySelectorAll("[data-gc]")];
  const showOut=()=>{ all.forEach(i=>{i.closest(".f").style.display=i.dataset.sc===out?"none":"";});
    gcs.forEach(i=>{i.closest(".f").style.display=i.dataset.gc===out?"none":"";});
    document.querySelectorAll("[data-out]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.out===out));
    document.querySelectorAll(`[data-tb="${out}"]`).forEach(b=>b.setAttribute("aria-pressed",false)); };
  const keepScores=()=>{ if(editGame!==null) return; resume.sc[s.id]={...Object.fromEntries(all.map(i=>[i.dataset.sc,i.value])),_tobi:tobiPressed(),...(out?{_out:out}:{}),...(gcs.length?{_gc:Object.fromEntries(gcs.map(i=>[i.dataset.gc,i.value]))}:{})}; keepResume();};
  const tobiPressed=()=>{ const b=document.querySelector('[data-tb][aria-pressed="true"]'); return b?b.dataset.tb:undefined; };
  document.querySelectorAll("[data-tb]").forEach(b=>b.onclick=()=>{ const on=b.getAttribute("aria-pressed")!=="true"; document.querySelectorAll("[data-tb]").forEach(x=>x.setAttribute("aria-pressed",false)); b.setAttribute("aria-pressed",on); keepScores(); });
  all.forEach(i=>i.oninput=keepScores);
  gcs.forEach(i=>i.oninput=keepScores);
  const gcOn=document.getElementById("gcOn"); if(gcOn) gcOn.onclick=()=>{ if(!unlocked()){toast("半荘ごとのチップは拡張機能です");return;} undoable("半荘ごとのチップにしました",()=>startGameChips(s)); };
  const gcOff=document.getElementById("gcOff"); if(gcOff) gcOff.onclick=()=>{ if(!confirm("半荘ごとの枚数を消して、合計だけにしますか？")) return; undoable("合計だけの入力に戻しました",()=>stopGameChips(s)); };
  document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{out=b.dataset.out; showOut(); keepScores();});
  showOut();
  document.getElementById("auto").onclick=()=>{const inputs=live(), empty=inputs.filter(i=>i.value.trim()==="");if(empty.length!==1){document.getElementById("gErr").textContent="空いている欄が1つのときに使えます";return;}
    const vals=inputs.filter(i=>i.value.trim()!=="").map(i=>parseScore(i.value,scoreUnit(s.rule)));
    if(vals.includes(null)){document.getElementById("gErr").textContent="読めない点数があります";return;}
    empty[0].value=String(((s.rule.direct?0:s.rule.start*s.rule.mode)-vals.reduce((a,b)=>a+b,0))/scoreUnit(s.rule)); keepScores();};
  document.querySelectorAll("[data-input]").forEach(b=>b.onclick=()=>{s.rule.direct=b.dataset.input==="point"; db.settings.lastDirect=s.rule.direct; save(); render();});
  document.getElementById("addG").onclick=()=>{
    const inputs=live();
    if(inputs.some(i=>i.value.trim()==="")){document.getElementById("gErr").textContent="全員の点数を入れてください";return;}
    const scores=Object.fromEntries(inputs.map(i=>[i.dataset.sc,parseScore(i.value,scoreUnit(s.rule))]));
    if(Object.values(scores).includes(null)){document.getElementById("gErr").textContent="読めない点数があります";return;}
    const gcLive=gcs.filter(i=>i.dataset.gc!==out&&i.value.trim()!=="");
    if(gcLive.some(i=>parseSigned(i.value)===null)){document.getElementById("gErr").textContent="読めないチップの枚数があります";return;}
    const chips=Object.fromEntries(gcLive.map(i=>[i.dataset.gc,parseSigned(i.value)]).filter(([,n])=>n));
    const r=scoreGame(scores,s.rule,s.members);
    if(!r.ok){document.getElementById("gErr").textContent=s.rule.direct?`合計が${fmtPt(r.total/1000)}です（0のはず）`:`合計が${r.total.toLocaleString()}点です（${r.expected.toLocaleString()}点のはず）`;return;}
    const flown=s.rule.tobi&&!s.rule.direct?Object.keys(scores).filter(id=>scores[id]<=0):[];
    let tobiBy=tobiPressed();
    if(tobiBy&&flown.includes(tobiBy)){document.getElementById("gErr").textContent="0点以下の人は飛ばした人にできません";return;}
    if(tobiBy&&!flown.length){document.getElementById("gErr").textContent="0点以下の人がいません。「飛ばした」を外してください";return;}
    const finish=order=>{
      if(editGame!==null){ const i=editGame; editGame=null; undoable("半荘を直しました",()=>{s.games[i].scores=scores; if(order)s.games[i].order=order; else delete s.games[i].order; if(tobiBy)s.games[i].tobiBy=tobiBy; else delete s.games[i].tobiBy; if(s.chipByGame){ s.games[i].chips=chips; syncGameChips(s); } }); return; }
      s.games.push({scores,...(order?{order}:{}),...(tobiBy?{tobiBy}:{}),...(s.chipByGame?{chips}:{})}); syncGameChips(s); db.sample=false; delete resume.sc[s.id]; save(); if(unlocked()) takeSnap(true); render(); warnBrowser();
    };
    const box=document.getElementById("tieBox"), order=[];
    const groups=s.rule.direct||s.rule.tie==="split"?[]:tieGroups(scores);
    // 飛ばした人が押されていないときは、トビ賞の入れ忘れを防ぐためここで聞く
    const nextStep=()=>{ if(!groups.length) return finish(); ask(groups[0],groups.slice(1)); };
    // 起家は半荘ごとに変わるので、同点の上下はその場で聞く
    const ask=(left,rest)=>{
      if(left.length===1){ order.push(left[0]); if(!rest.length) return finish(order); return ask(rest[0],rest.slice(1)); }
      box.hidden=false;
      box.innerHTML=`<p class="unitnote"><b>同点です</b>：上の人を押してください（起家に近い人）</p><div class="row">${left.map(id=>`<button class="chip" data-tie="${id}">${esc(P(id).name)}</button>`).join("")}</div>`;
      box.querySelectorAll("[data-tie]").forEach(b=>b.onclick=()=>{order.push(b.dataset.tie); ask(left.filter(id=>id!==b.dataset.tie),rest);});
      box.scrollIntoView({block:"center"});
    };
    if(!flown.length||tobiBy) return nextStep();
    box.hidden=false;
    box.innerHTML=`<p class="unitnote"><b>0点以下の人がいます</b>：飛ばした人を押してください</p><div class="row">${Object.keys(scores).filter(id=>!flown.includes(id)).map(id=>`<button class="chip" data-tbask="${id}">${esc(P(id).name)}</button>`).join("")}<button class="chip" data-tbask="">なし</button></div>`;
    box.querySelectorAll("[data-tbask]").forEach(b=>b.onclick=()=>{tobiBy=b.dataset.tbask||undefined; nextStep();});
    box.scrollIntoView({block:"center"});
  };
  const no=document.getElementById("editNo"); if(no) no.onclick=()=>{editGame=null;render();};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editGame=Number(b.dataset.edit);render();document.getElementById("gHead").scrollIntoView({block:"center"});});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(!askDel(`${Number(b.dataset.del)+1}半荘目を消しますか？`))return; editGame=null;undoable("半荘を消しました",()=>{s.games.splice(Number(b.dataset.del),1); syncGameChips(s);});});
  const sh=document.getElementById("sShare"); if(sh) sh.onclick=async()=>{
    const text=settleText(s,id=>P(id).name);
    if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(text); toast("精算の文をコピーしました。LINE に貼り付けてください"); }
    catch(e){ const b=document.getElementById("shareBox"); b.value=text; b.hidden=false; b.focus(); b.select(); toast("文を長押ししてコピーしてください"); }
  };
  const done=document.getElementById("sDone"); if(done) done.onclick=()=>{
    if(live().some(i=>i.value.trim()!=="")){document.getElementById("gErr").textContent="入れかけの点数があります。先に「記録する」を押すか、消してください";document.getElementById("gErr").scrollIntoView({block:"center"});return;}
    openSession=null; tab="sessions"; render(); window.scrollTo(0,0); toast("記録しました"); };
  document.getElementById("sVenue").onchange=e=>{const n=parseSigned(e.target.value)||0; s.venue={...s.venue,amount:Math.max(n,0)}; save(); render();};
  document.querySelectorAll("[data-vhow]").forEach(b=>b.onclick=()=>{s.venue={...s.venue,how:b.dataset.vhow}; save(); render();});
  document.getElementById("sSave").onclick=()=>{
    const v=id=>document.getElementById(id).value, u=parseUma(v("sUma"),s.rule.mode), nums=["sRate","sChipR","sFee","sStart","sRet"].map(id=>parseSigned(v(id)));
    if(!u){document.getElementById("sErr").textContent=umaHelp(s.rule.mode);return;}
    if(nums.includes(null)||!v("sDate")){document.getElementById("sErr").textContent="日付と数字を入れてください";return;}
    undoable("この回を直しました",()=>{ s.date=v("sDate"); s.title=v("sTitle").trim(); s.tags=v("sTags").split(/\s+/).filter(Boolean);
      [s.rule.rate,s.rule.chipRate,s.rule.fee,s.rule.start,s.rule.ret]=nums; s.rule.uma=u; s.rule.round=v("sRound"); if(s.rule.tobi) s.rule.tobiDouble=v("sDouble"); });
  };
  const sw=document.getElementById("swOk"); if(sw) sw.onclick=()=>{ const from=document.getElementById("swFrom").value, to=document.getElementById("swTo").value;
    if(!confirm(`${P(from).name}を${GUESTS.includes(to)?"ゲスト"+to.slice(5):P(to).name}に置き換えますか？`)) return;
    undoable("メンバーを置き換えました",()=>{ ensureGuest(db,to); swapPlayer(s,from,to); delete resume.sc[s.id]; }); };
  document.querySelectorAll("[data-chip]").forEach(i=>{
    i.oninput=()=>{const n=parseSigned(i.value); if(n!==null){s.chips=s.chips||{};s.chips[i.dataset.chip]=n;save();}};
    i.onchange=()=>{s.chips=s.chips||{};s.chips[i.dataset.chip]=parseSigned(i.value)||0;save();render();};});
  document.getElementById("delS").onclick=()=>{document.getElementById("delConfirm").hidden=false;};
  document.getElementById("delYes").onclick=()=>{ takeSnap(true); undoable("セッションを消しました",()=>{db.sessions=db.sessions.filter(x=>x.id!==s.id);delete resume.sc[s.id];openSession=null;}); };
}

/* --- フリー：自分の点数と着順だけで、その半荘の結果を出す。記録はその日のセッションに入る --- */
const FREE_RULES={
  4:{mode:4,start:25000,ret:30000,uma:[30,10,-10,-30],tobi:0,round:"56"},
  3:{mode:3,start:35000,ret:40000,uma:[20,0,-20],tobi:10,round:""},
};
let freeRank=1, freeTobi=false, freeOpen=null, freeFlash="", freeEdit=null;
function freeState(){ return db.free || (db.free={rule:{...JSON.parse(JSON.stringify(FREE_RULES[4])),rate:50,chipRate:0,fee:0,feeTop:""},games:[]}); }
const quickHTML=r=>`<thead><tr><th>点数</th>${Array.from({length:r.mode},(_,k)=>`<th>${k+1}着</th>`).join("")}</tr></thead><tbody>${quickTable(r).map(x=>`<tr><td>${x.score.toLocaleString()}</td>${x.cells.map(v=>v===null?'<td class="note">−</td>':`<td class="${cls(v)}">${fmtP(v)}</td>`).join("")}</tr>`).join("")}</tbody>`;
function freeLine(g){ return freeResult(g.score,g.rank,g.chips,g.rule,g.tobiWin); }
const ruleCopy=r=>JSON.parse(JSON.stringify({mode:r.mode,start:r.start,ret:r.ret,uma:r.uma,rate:r.rate,chipRate:r.chipRate,fee:r.fee||0,feeTop:r.feeTop??"",tobi:r.tobi||0,round:r.round||"",tobiDouble:r.tobiDouble||""}));
const ruleKey=r=>JSON.stringify(ruleCopy(r));
const ROUNDS=[["","そのまま"],["56","五捨六入"],["45","四捨五入"]];
const roundOpts=now=>ROUNDS.map(([v,l])=>`<option value="${v}" ${(now||"")===v?"selected":""}>${l}</option>`).join("");
const ruleLine=r=>`${modeName(r.mode)}・${r.start}持ち${r.ret}返し・ウマ${r.uma.join("/")}${r.tobi?`・トビ賞${r.tobi}`:""}${r.tobi&&r.tobiDouble==="half"?"・ダブルは分ける":r.tobi&&r.tobiDouble==="low"?"・ダブルは一番低い人":""}${r.round==="56"?"・五捨六入":r.round==="45"?"・四捨五入":""}・${rateName(r.rate)}${r.chipRate?`・チップ${r.chipRate}P`:""}${r.fee?`・ゲーム代${r.fee}P`:""}`;
// 四麻と三麻を切り替えても、それぞれ前に使っていたルールに戻す
function setFreeMode(r,m){ const f=freeState(), by=f.byMode=f.byMode||{}; by[r.mode]=ruleCopy(r); if(by[m]) Object.assign(r,JSON.parse(JSON.stringify(by[m]))); else{ Object.assign(r,JSON.parse(JSON.stringify(FREE_RULES[m]))); r.chipRate=chipFor(m,r.rate); } if(freeRank>m) freeRank=1; }
function saveRule(name){
  const r=freeState().rule, x=db.rules.find(v=>v.name===name);
  if(x&&!confirm(`「${name}」はもうあります。今のルールで上書きしますか？`)) return;
  if(x) x.rule=ruleCopy(r); else db.rules.push({id:uid(),name,rule:ruleCopy(r),place:""});
  save();
}
const freeItem=g=>{const x=freeLine(g);return `<div class="item" style="cursor:default"><span>${g.rank}着 <span class="num">${g.score.toLocaleString()}点</span>${g.chips?`<span class="note"> チップ${g.chips}</span>`:""}${g.tobiWin?'<span class="note"> 飛ばした</span>':""}</span><span class="row"><b class="${cls(x.total)}">${fmtP(x.total)}</b><button class="small ghost" data-fedit="${g.id}" aria-label="この半荘を直す">直す</button><button class="small ghost" data-fdel="${g.id}" aria-label="この半荘を消す">消す</button></span></div>`;};
// 今日の着順の回数。四麻と三麻が混ざる日は分けて出す
function freeRanks(games){
  const ms=[4,3].filter(m=>games.some(g=>g.rule.mode===m));
  return ms.map(m=>`${ms.length>1?modeName(m)+" ":"今日 "}${rankDist(games.filter(g=>g.rule.mode===m).map(g=>({best:g.rank,worst:g.rank})),m).map((n,k)=>`${k+1}着${n}回`).join("・")}`).join("<br>");
}
function viewFree(){
  const f=freeState(), r=f.rule, day=today(), kept=resume.free;
  if(freeRank>r.mode) freeRank=1;
  const todays=f.games.filter(g=>g.date===day), sum=freeSummary(todays).total, open=freeOpen===null?!f.games.length:freeOpen;
  return `<section class="card"><div class="row between"><h2>この半荘の結果</h2><span class="note">今日 <b class="${cls(sum)}">${fmtP(sum)}</b></span></div>
    ${todays.length?`<p class="note" id="fRanks">${freeRanks(todays)}</p>`:""}
    ${howBox("free")}
    ${seg("fmode",[[4,"四麻"],[3,"三麻"]],r.mode)}
    ${db.rules.length?`<div class="row">${db.rules.map(x=>`<button class="chip" data-rapply="${x.id}" aria-pressed="${ruleKey(x.rule)===ruleKey(r)}">${esc(x.name)}</button>`).join("")}</div>`:""}
    <div class="rulebox"><b>今のルール</b><br><span id="fRuleNow">${ruleLine(r)}</span><br><span class="note" id="fRuleNote">${ruleNote(r)}</span></div>
    ${unitNote(r)}
    <div class="seg">${Array.from({length:r.mode},(_,k)=>`<button class="chip" data-frank="${k+1}" aria-pressed="${freeRank===k+1}">${k+1}着</button>`).join("")}</div>
    <label class="f">自分の点数${sfield(`id="fScore" placeholder="${r.mode===4?"300":"30"}"`,kept.score||"")}</label>
    <label class="f">チップ（任意）${chipField('id="fChip" placeholder="0"',kept.chip||"")}</label>
    ${r.tobi?`<button class="chip" id="fTobi" aria-pressed="${freeTobi}">飛ばした（+${r.tobi}）</button>`:""}
    <div class="free-out" id="fOut" aria-live="polite">-</div>
    <p class="note" id="fDetail">点数を入れると、ここに結果が出ます。</p>
    <button class="primary wide" id="fAdd">記録する</button>
    <span class="warn" id="fErr"></span>${freeFlash?`<span class="note" role="status">${esc(freeFlash)}</span>`:""}
  </section>
  <section class="card"><div class="row between"><h2>今日の半荘</h2><span class="note">${todays.length}半荘</span></div>
    <div class="list">${todays.slice().reverse().map(freeItem).join("")||'<p class="note">まだ記録がありません。記録はセッションのタブにも入ります。</p>'}</div>
  </section>
  <section class="card"><details id="fRules" ${open?"open":""}><summary>ルールを変える</summary><div class="stack" style="margin-top:8px">
    <div class="grid2"><label class="f">持ち点<input inputmode="numeric" data-frule="start" value="${r.start}"></label><label class="f">返し<input inputmode="numeric" data-frule="ret" value="${r.ret}"></label></div>
    <div class="grid2"><label class="f">ウマ（5-10 や 5,10 でも可）<input data-frule="uma" value="${r.uma.join(",")}"></label><label class="f">トビ賞（なしは0）<input inputmode="decimal" data-frule="tobi" value="${r.tobi||0}"></label></div>
    <label class="f">千点未満の端数<select data-frule="round">${roundOpts(r.round)}</select></label>
    <div class="grid2"><label class="f">千点あたり（P）<input inputmode="decimal" data-frule="rate" value="${r.rate}"></label><label class="f">チップ1枚（P）<input inputmode="decimal" data-frule="chipRate" value="${r.chipRate}"></label></div>
    <div class="grid2"><label class="f">ゲーム代（P）<input inputmode="decimal" data-frule="fee" value="${r.fee}"></label><label class="f">トップのゲーム代（同じなら空）<input inputmode="decimal" data-frule="feeTop" value="${r.feeTop}"></label></div>
    <span class="warn" id="fRuleErr"></span>
    <div class="row"><input id="rName" placeholder="ルールの名前（例：いつもの三麻）" style="flex:1"><button class="small" id="rSave">このルールを保存</button></div>
  </div></details></section>
  <section class="card"><details class="howtobox" data-howto="quick" ${(db.settings.howClosed||{}).quick?"":"open"}><summary><h2>点数の早見表</h2></summary>
    <p class="note">いまのルールでの結果です。チップは入れず、ゲーム代は引いています。飛ばしたときのトビ賞は入っていません。「−」は起こらない組み合わせです。</p>
    <div class="tablebox"><table id="fTable">${quickHTML(r)}</table></div></details></section>`;
}
function bindFree(){
  const f=freeState(), r=f.rule;
  const score=document.getElementById("fScore"), chip=document.getElementById("fChip");
  const paint=()=>{
    document.getElementById("fRuleNow").textContent=ruleLine(r);
    document.getElementById("fRuleNote").textContent=ruleNote(r);
    document.getElementById("fTable").innerHTML=quickHTML(r);
    const out=document.getElementById("fOut"), sc=parseScore(score.value,scoreUnit(r));
    if(sc===null){ out.textContent="-"; out.className="free-out"; return; }
    const x=freeResult(sc,freeRank,parseSigned(chip.value)||0,r,freeTobi);
    out.textContent=fmtP(x.total); out.className="free-out "+cls(x.total);
    document.getElementById("fDetail").textContent=`${sc.toLocaleString()}点・${freeRank}着：ポイント ${fmtPt(x.point)}${x.fee?`、ゲーム代 ${x.fee.toLocaleString()}P`:""}`;
    document.getElementById("fErr").textContent=impossibleScore(sc,freeRank,r)?badMsg(sc):"";
  };
  const badMsg=sc=>`${freeRank}着で${sc.toLocaleString()}点は起こらない組み合わせです。点数か着順を確かめてください`;
  const keepFree=()=>{resume.free={score:score.value,chip:chip.value,rank:freeRank,tobi:freeTobi}; keepResume();};
  score.oninput=chip.oninput=()=>{paint(); keepFree();};
  document.querySelectorAll("[data-frank]").forEach(b=>b.onclick=()=>{freeRank=Number(b.dataset.frank);
    document.querySelectorAll("[data-frank]").forEach(c=>c.setAttribute("aria-pressed",c===b)); paint(); keepFree();});
  const tobi=document.getElementById("fTobi"); if(tobi) tobi.onclick=()=>{freeTobi=!freeTobi; tobi.setAttribute("aria-pressed",freeTobi); paint(); keepFree();};
  document.getElementById("fAdd").onclick=()=>{
    const sc=parseScore(score.value,scoreUnit(freeState().rule));
    if(sc===null){document.getElementById("fErr").textContent="点数を入れてください";return;}
    if(impossibleScore(sc,freeRank,r)&&!confirm(`${badMsg(sc)}\n\nこのまま記録しますか？`)) return;
    const g={id:uid(),date:today(),score:sc,rank:freeRank,chips:parseSigned(chip.value)||0,tobiWin:freeTobi,rule:ruleCopy(r)};
    f.games.push(g); db.sample=false; freeTobi=false; resume.free={rank:freeRank}; save(); if(unlocked()) takeSnap(true); warnBrowser();
    const t=freeSummary(f.games.filter(x=>x.date===g.date)).total;
    freeFlash=`記録しました　この半荘 ${fmtP(freeLine(g).total)}　今日 ${fmtP(t)}`; render(); freeFlash="";
  };
  document.getElementById("fRules").ontoggle=e=>{freeOpen=e.target.open;};
  document.querySelectorAll("[data-fmode]").forEach(b=>b.onclick=()=>{setFreeMode(r,Number(b.dataset.fmode));freeTobi=false;save();render();});
  document.querySelectorAll("[data-rapply]").forEach(b=>b.onclick=()=>{Object.assign(r,ruleCopy(db.rules.find(x=>x.id===b.dataset.rapply).rule));if(freeRank>r.mode)freeRank=1;save();render();});
  document.querySelectorAll("[data-frule]").forEach(i=>i.onchange=()=>{
    const k=i.dataset.frule, msg=document.getElementById("fRuleErr"); msg.textContent="";
    if(k==="uma"){ const u=parseUma(i.value,r.mode);
      if(!u){msg.textContent=umaHelp(r.mode);return;}
      r.uma=u; }
    else if(k==="round") r.round=i.value;
    else if(k==="feeTop"&&i.value.trim()==="") r.feeTop="";
    else{ const n=parseSigned(i.value); if(n===null){msg.textContent="数字を入れてください";return;}
      if(k==="rate"&&r.chipRate===chipFor(r.mode,r.rate)){ r.chipRate=chipFor(r.mode,n); document.querySelector('[data-frule="chipRate"]').value=r.chipRate; }
      r[k]=n; }
    save(); paint();
  });
  document.getElementById("rSave").onclick=()=>{const n=document.getElementById("rName").value.trim(); if(!n){document.getElementById("fRuleErr").textContent="ルールの名前を入れてください";return;} saveRule(n); render();};
  bindFreeRows(f);
  paint();
}
function bindFreeRows(f){
  document.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>{if(!askDel("この半荘を消しますか？"))return; freeEdit=null;undoable("半荘を消しました",()=>{f.games=f.games.filter(g=>g.id!==b.dataset.fdel);});});
  document.querySelectorAll("[data-fedit]").forEach(b=>b.onclick=()=>{const g=f.games.find(x=>x.id===b.dataset.fedit); tab="sessions"; openSession="free:"+g.date; freeEdit=g.id; render();
    const e=document.getElementById("eForm"); if(e) e.scrollIntoView({block:"center"});});
}
// フリーの1日：半荘を開いて、点数・着順・チップ・日付・ルールを直す
function viewFreeDay(day){
  const gs=freeState().games.filter(g=>g.date===day);
  if(!gs.length){ openSession=null; freeEdit=null; return viewSessions(); }
  const x=freeSummary(gs);
  const form=g=>`<div class="stack" id="eForm"><div class="seg">${Array.from({length:4},(_,k)=>`<button class="chip" data-erank="${k+1}" aria-pressed="${g.rank===k+1}">${k+1}着</button>`).join("")}</div>
    <label class="f">点数${sfield('id="eScore"',String(g.score/scoreUnit(g.rule)))}</label>
    <label class="f">チップ${chipField('id="eChip"',g.chips||0)}</label>
    <button class="chip" id="eTobi" aria-pressed="${!!g.tobiWin}">飛ばした</button>
    <div class="grid2"><label class="f">日付<input type="date" id="eDate" value="${g.date}"></label><label class="f">ルール<select id="eRule"><option value="">いまのまま</option>${db.rules.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}<option value="m4">標準の四麻</option><option value="m3">標準の三麻</option></select></label></div>
    <button class="primary wide" id="eOk">この半荘を直す</button><div class="row"><button class="small ghost" id="eNo">やめる</button><span class="warn" id="eErr"></span></div></div>`;
  return `<section class="card"><div class="row between"><button class="small ghost" id="back">← 戻る</button><span class="tag free">フリー</span></div>
    <div class="row between"><h2 class="num">${day}</h2><b class="${cls(x.total)}">${fmtP(x.total)}</b></div>
    <p class="note">${x.games}半荘・平均着順 ${x.avgRank.toFixed(2)}</p>
    <div class="list">${gs.map(g=>g.id===freeEdit?form(g):freeItem(g)).join("")}</div></section>`;
}
function bindFreeDay(){
  const f=freeState();
  document.getElementById("back").onclick=()=>{openSession=null;freeEdit=null;render();window.scrollTo(0,0);};
  bindFreeRows(f);
  const g=f.games.find(x=>x.id===freeEdit); if(!g||!document.getElementById("eForm")) return;
  let rank=g.rank, tobi=!!g.tobiWin;
  document.querySelectorAll("[data-erank]").forEach(b=>b.onclick=()=>{rank=Number(b.dataset.erank);document.querySelectorAll("[data-erank]").forEach(c=>c.setAttribute("aria-pressed",c===b));});
  const t=document.getElementById("eTobi"); t.onclick=()=>{tobi=!tobi;t.setAttribute("aria-pressed",tobi);};
  document.getElementById("eNo").onclick=()=>{freeEdit=null;render();};
  document.getElementById("eOk").onclick=()=>{
    const err=document.getElementById("eErr"), sc=parseScore(document.getElementById("eScore").value,scoreUnit(g.rule)), v=document.getElementById("eRule").value, date=document.getElementById("eDate").value;
    const rule=!v?g.rule:v==="m4"||v==="m3"?{...ruleCopy(g.rule),...JSON.parse(JSON.stringify(FREE_RULES[v.slice(1)]))}:ruleCopy(db.rules.find(r=>r.id===v).rule);
    if(sc===null||!date){err.textContent="点数と日付を入れてください";return;}
    if(rank>rule.mode){err.textContent=`このルールは${rule.mode}着までです`;return;}
    freeEdit=null; openSession="free:"+date;
    undoable("半荘を直しました",()=>{ Object.assign(g,{score:sc,rank,chips:parseSigned(document.getElementById("eChip").value)||0,tobiWin:tobi,date,rule}); });
  };
}

let editP=null;
const COLORS=["#4f6b55","#2f6fb0","#c0443b","#b8892c","#7a5ea8","#2d8a8a","#c06a2b","#6b6b6b"];

  const me=db.settings.me, def=db.settings.defaultRule;
  return `<section class="card">${howBox("players")}</section>
  <section class="card"><h2>保存したルール</h2>

  <div class="list">${db.rules.map(x=>`<div class="stack item" style="cursor:default;display:grid"><div><b>${esc(x.name)}</b>${def===x.id?' <span class="tag">既定</span>':""}<br><span class="meta">${ruleLine(x.rule)}<br>${ruleNote(x.rule)}</span></div>
    <div class="row"><button class="small" data-suse="r:${x.id}">セットで使う</button><button class="small" data-ruse="${x.id}">フリーで使う</button><button class="small ghost" data-rdef="${x.id}">${def===x.id?"既定を外す":"既定にする"}</button><button class="small ghost" data-rdel="${x.id}">消す</button></div></div>`).join("")||'<p class="note">まだありません。下の欄で、いまのフリーのルールを保存できます。</p>'}</div>
  <h3>よくあるルール</h3>
  <div class="list">${["m4f","m4g","m3f"].map(k=>{const r=RULE_PRESETS[k];return `<div class="stack item" style="cursor:default;display:grid"><div><b>${r.label}</b><br><span class="meta">${r.note}<br>${ruleNote(r)}</span></div><div class="row"><button class="small" data-suse="${k}">セットで使う</button><button class="small" data-puse="${k}">フリーで使う</button></div></div>`;}).join("")}</div>
  <details><summary>言葉の説明</summary><p class="note">持ち点：最初に持つ点数。返し：計算の基準になる点数。ウマ：着順で増減する分。オカ：持ち点と返しの差の合計で、1着がもらう分。トビ賞：0点以下で払う分。五捨六入：百の位が5までは切り捨て、6からは切り上げ。合計のずれは1着が受けます。レート：千点あたりのPで、0.5は50P、1は100P。</p></details>
  <p class="note">いまのフリーのルール：${ruleLine(freeState().rule)}</p>
  <div class="row"><input id="rName2" placeholder="ルールの名前（例：いつもの三麻）" style="flex:1"><button class="small primary" id="rSave2">このルールを保存</button></div>
  <span class="warn" id="rErr"></span></section>
  <section class="card"><h2 id="memH">メンバー</h2>
  <div class="list">${db.players.filter(p=>!p.guest).map(p=>editP===p.id?`<div class="stack item" style="cursor:default;display:grid"><div class="row"><input id="pEName" value="${esc(p.name)}" aria-label="名前" style="flex:1"><button class="small primary" id="pESave">保存</button><button class="small ghost" id="pENo">やめる</button></div><div class="row">${COLORS.map(c=>`<button class="chip" data-pcolor="${c}" aria-pressed="${c===p.color}" aria-label="色" style="background:${c};min-width:36px;min-height:32px"></button>`).join("")}</div></div>`:`<div class="item" style="cursor:default"><span><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="note">　${db.sessions.filter(s=>s.members.includes(p.id)).length}回参加</span></span><span class="row" style="flex-wrap:nowrap"><button class="small ghost" data-pedit="${p.id}" aria-label="${esc(p.name)}を直す">直す</button>${db.sessions.some(s=>s.members.includes(p.id))?"":`<button class="small ghost" data-pdel="${p.id}" aria-label="${esc(p.name)}を消す">消す</button>`}<button class="chip" data-me="${p.id}" aria-pressed="${me===p.id}">自分</button></span></div>`).join("")||'<p class="note">まだ誰もいません</p>'}</div>
  <p class="note">「自分」を選ぶと、セットの収支もセッションの合計とカレンダーに入ります。</p>

}
// ゲストや二重に作った人の記録を、別の人へまとめる
function mergeHTML(){
  const from=db.players.filter(p=>db.sessions.some(s=>s.members.includes(p.id))), to=db.players.filter(p=>!p.guest);
  if(!from.length||to.length<1||db.players.length<2) return "";
  const opt=p=>`<option value="${p.id}">${esc(p.name)}</option>`;
  return `<details><summary>記録をほかの人にまとめる</summary><div class="stack" style="margin-top:8px"><p class="note">ゲストで入れた人を本人の成績に入れるときや、同じ人を2回作ったときに使います。</p><div class="grid2"><label class="f">この人の記録を<select id="mgFrom">${from.map(opt).join("")}</select></label><label class="f">この人にまとめる<select id="mgTo">${to.map(opt).join("")}</select></label></div><button class="small" id="mgOk">まとめる</button><span class="warn" id="mgErr"></span></div></details>`;
}
function bindPlayers(){
  const mg=document.getElementById("mgOk");
  if(mg) mg.onclick=()=>{ const from=document.getElementById("mgFrom").value, to=document.getElementById("mgTo").value, err=document.getElementById("mgErr");
    if(from===to){ err.textContent="同じ人です。別の人を選んでください"; return; }
    if(!confirm(`${P(from).name}の記録を${P(to).name}にまとめますか？`)) return;
    let r; undoable("記録をまとめました",()=>{ r=mergePlayer(db,from,to); });
    if(r.skipped) toast(`2人が同じ回にいる${r.skipped}回はまとめられませんでした`); };
  document.querySelectorAll("[data-pedit]").forEach(b=>b.onclick=()=>{editP=b.dataset.pedit;render();});
  const pe=document.getElementById("pESave");
  if(pe){ let color=P(editP).color;
    document.querySelectorAll("[data-pcolor]").forEach(b=>b.onclick=()=>{color=b.dataset.pcolor;document.querySelectorAll("[data-pcolor]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
    document.getElementById("pENo").onclick=()=>{editP=null;render();};
    pe.onclick=()=>{ const n=document.getElementById("pEName").value.trim(); if(!n) return; Object.assign(P(editP),{name:n,color}); delete P(editP).sample; editP=null; save(); render(); }; }
  const add=document.getElementById("pAdd"); if(add) add.onclick=()=>{const n=document.getElementById("pName").value.trim(); if(!n)return;
    db.players.push({id:uid(),name:n,color:COLORS[db.players.length%COLORS.length]}); save(); render();};
  const toSet=document.getElementById("pToSet"); if(toSet) toSet.onclick=()=>{tab="settings";render();window.scrollTo(0,0);};
  document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>undoable("メンバーを消しました",()=>{const id=b.dataset.pdel; db.players=db.players.filter(p=>p.id!==id); if(db.settings.me===id) db.settings.me="";}));

function csvRows(){
  const rows=[["日付","名前","場所","ルール","千点あたり(P)","半荘","メンバー","点数","着順","ポイント","チップ"]];
  db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.games.forEach((g,gi)=>{const r=scoreGame(g.scores,s.rule,g.order||s.members,g.tobiBy);
    s.members.filter(id=>r.res[id]).forEach(id=>rows.push([s.date,s.title||"",(s.tags||[]).join(" "),s.rule.mode===3?"三麻":"四麻",s.rule.rate,gi+1,P(id).name,g.scores[id],r.res[id].rank,r.res[id].point,(g.chips||{})[id]??""]));}));
  freeDays(freeState().games).reverse().forEach(d=>d.items.forEach((g,i)=>rows.push([g.date,"フリー","",modeName(g.rule.mode),g.rule.rate,i+1,"自分",g.score,g.rank,freeLine(g).point,g.chips||""])));
  return rows;
}
function settleRows(){
  const rows=[["日付","名前","場所","ルール","千点あたり(P)","メンバー","半荘数","ポイント","チップ","その他","ゲーム代","収支"]];
  db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const t=sessionTotals(s);
    s.members.forEach(id=>rows.push([s.date,s.title||"",(s.tags||[]).join(" "),s.rule.mode===3?"三麻":"四麻",s.rule.rate,P(id).name,t[id].games,t[id].point,t[id].chips,t[id].extra,t[id].fee,t[id].yen]));});
  freeDays(freeState().games).reverse().forEach(d=>{const uniq=f=>[...new Set(d.items.map(f))].join("/"), line=d.items.map(freeLine);
    rows.push([d.date,"フリー","",uniq(g=>modeName(g.rule.mode)),uniq(g=>g.rule.rate),"自分",d.games,d.point,d.items.reduce((a,g)=>a+g.chips,0),"",line.reduce((a,x)=>a+x.fee,0),d.total]);});
  return rows;
}

// スマホは共有の画面を出す。iPhone はここから「ファイル」に保存できる。やめたら "cancel"
async function saveFile(name,blob){
  const file=new File([blob],name,{type:blob.type.split(";")[0]});
  if(navigator.maxTouchPoints>0 && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return "done"; }
    catch(e){ if(e.name==="AbortError") return "cancel"; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  return "done";
}

  const res=await saveFile(`hanchan-note-${stamp()}.json`,new Blob([JSON.stringify({...db,settings:{...db.settings,...mark}})],{type:"application/json"}));
  if(res!=="cancel") return done();

  const m=document.getElementById("bkMsg"); if(!m) return;
  m.innerHTML=`取りやめました。保存できていたら押してください <button class="small" id="bkOk">保存できた</button>`;
  document.getElementById("bkOk").onclick=done;
}

    ${on?`<div class="row"><button class="small primary" id="bkFile">ファイルに保存</button><span class="note" id="bkMsg"></span></div>
    <label class="f">保存の声かけ<select id="nudge">${[[3,"3半荘ごと"],[5,"5半荘ごと"],[10,"10半荘ごと"],[30,"30半荘ごと"],[0,"声をかけない"]].map(([v,l])=>`<option value="${v}" ${(db.settings.nudgeEvery??NUDGE_DEFAULT)===v?"selected":""}>${l}</option>`).join("")}</select></label>
    <details><summary>ファイルに保存できないとき（文字でコピー）</summary><div class="stack" style="margin-top:8px"><textarea id="bk" readonly>${esc(JSON.stringify(db))}</textarea><div class="row"><button class="small" id="bkCopy">コピー</button></div></div></details>
`:lockedNote("バックアップ")}
  </section>
  ${db.saved.length?`<section class="card"><h2>保存した条件</h2><div class="list">${savedList}</div></section>`:""}
  <section class="card"><h2>CSV・Excel 書き出し${on?"":'<span class="lock">拡張</span>'}</h2>
    ${on?`<p class="note">全部の記録を出します。Excel は「半荘ごと」と「精算」の2枚のシートになります。</p>
    <div class="row"><button class="small primary" id="xlsxFile">Excel に保存</button><button class="small" id="csvFile">CSV（半荘ごと）</button><button class="small" id="csvFile2">CSV（精算）</button></div>
    <span class="note" id="csvMsg"></span>
    <details><summary>ファイルに保存できないとき（文字でコピー）</summary><div class="stack" style="margin-top:8px"><textarea id="csv" readonly>${esc(toCSV(csvRows()))}</textarea><div class="row"><button class="small" id="csvCopy">コピー</button></div></div></details>`:lockedNote("書き出し")}
  </section>
  ${howtoHTML()}
  <section class="card"><h2>入力</h2><label class="row" style="gap:8px"><input type="checkbox" id="delAsk" ${db.settings.delAsk===false?"":"checked"}> 半荘を消す前に確かめる</label><p class="note">外しても、消した直後は「元に戻す」で戻せます。</p></section>
  <section class="card"><h2>このアプリについて</h2><p class="note">${ADS_ON?"広告は成績タブの下にだけ出ます。拡張機能を開くと消えます。":"広告はありません。"}登録は要りません。試作版のため、データの形は今後変わることがあります。</p><a class="note" href="privacy.html">データの扱いについて</a></section>`;
}
function bindUnlock(){
  const tr=document.getElementById("trialOk"); if(tr) tr.onclick=()=>{ startTrial(db.settings,Date.now()); save(); render(); toast(`${TRIAL_DAYS}日間、拡張機能を試せます`); };
  const ok=document.getElementById("codeOk"); if(!ok) return;
  ok.onclick=async()=>{ const r=await verifyCode(document.getElementById("codeIn").value);
    if(r.ok){ db.settings.unlocked=true; db.settings.unlockUntil=r.until; delete db.settings.lastSaveDone; delete db.settings.expirySkip; delete db.settings.trial; save(); render(); return; }
    document.getElementById("codeMsg").textContent=r.expired?"このコードは期限が切れています":"コードが違います。入力を確かめてください"; };
}
function bindBackup(){
  document.getElementById("delAsk").onchange=e=>{db.settings.delAsk=e.target.checked;save();};
  const last=document.getElementById("bkLast"); if(last) last.onclick=saveBackup;
  if(!unlocked()) return;
  document.getElementById("bkFile").onclick=saveBackup;
  document.getElementById("nudge").onchange=e=>{db.settings.nudgeEvery=Number(e.target.value);save();};
  const csvDone=r=>{ document.getElementById("csvMsg").textContent=r==="cancel"?"":SAVED_MSG; };
  document.getElementById("csvFile").onclick=async()=>csvDone(await saveFile(`hanchan-note-games-${stamp()}.csv`,csvBlob(csvRows())));
  document.getElementById("csvFile2").onclick=async()=>csvDone(await saveFile(`hanchan-note-settle-${stamp()}.csv`,csvBlob(settleRows())));
  document.getElementById("xlsxFile").onclick=async()=>{ const m=document.getElementById("csvMsg"); try{ csvDone(await saveFile(`hanchan-note-${stamp()}.xlsx`,await xlsxBlob())); }catch(e){ m.textContent="Excel の準備に失敗しました。電波のある所でもう一度試すか、CSV を使ってください"; } };
  copyBtn("bkCopy","bk","bkMsg"); copyBtn("csvCopy","csv","csvMsg");
  document.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=()=>undoable("条件を消しました",()=>{db.saved.splice(Number(b.dataset.sdel),1);}));
}
function copyBtn(btn,area,msg){document.getElementById(btn).onclick=async()=>{const t=document.getElementById(area);try{await navigator.clipboard.writeText(t.value);document.getElementById(msg).textContent="コピーしました";}catch(e){t.select();document.getElementById(msg).textContent="選択しました。長押しでコピーしてください";}};}
function bindSettings(){
  bindRestore(); bindUnlock(); bindBackup(); restoreMsg="";
}

// 前の版の記録に足りない項目を補う。三麻の初期設定が前の既定のままなら新しい既定にする（過去の半荘はルールの写しを持つので動かない）
function upgrade(){
  db.rules=db.rules||[];
  const r=db.free&&db.free.rule;
  if(r&&r.mode===4&&r.round===undefined) r.round="56";
  if(db.settings.ruleV>=1) return;   // 自分でウマなしにした人を毎回戻さないよう、この移しは1回だけ
  if(r&&r.mode===3&&r.uma.every(u=>!u)&&!r.tobi){ r.uma=[20,0,-20]; r.tobi=10; r.chipRate=r.chipRate||chipFor(3,r.rate); }
  db.settings.ruleV=1;
}

(async()=>{
  db=await load();
  upgrade();
  readResume();
  render();
  takeSnap();
  // 別の画面で新しく保存されていたら読み直す。古い内容で上書きしないように
  const fresher=()=>{ try{ const ls=JSON.parse(localStorage.getItem(KEY)); if(ls&&(ls.savedAt||0)>(db.savedAt||0)) location.reload(); }catch(e){} };
  addEventListener("storage",e=>{ if(e.key===KEY) fresher(); });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) takeSnap(); else fresher(); });
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
