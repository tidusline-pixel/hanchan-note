<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>半荘ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#4f6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="半荘ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* 層：上に条件バー → 数字 → グラフ → 一覧。下に固定のタブ。雀簿寄りのくすんだ緑と丸い角 */
:root{
  --bg:#f3f4ee; --card:#fbfbf7; --fg:#26302a; --mute:#6c776f; --line:#dde2d6;
  --accent:#4f6b55; --accent-weak:#e3ebe0; --plus:#2f6fb0; --minus:#c0443b; --gold:#b8892c;
  --r1:#4f6b55; --r2:#86a17c; --r3:#c9b77f; --r4:#c98a7a;
  --font:"Meiryo","メイリオ","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181c19; --card:#212722; --fg:#e7ebe4; --mute:#9aa59c; --line:#3a443b;
  --accent:#8fb293; --accent-weak:#2b362d; --plus:#7fb2e8; --minus:#ec8a80; --gold:#d9b25c;
  --r1:#8fb293; --r2:#5f7d5f; --r3:#a99a63; --r4:#a8695b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181c19; --card:#212722; --fg:#e7ebe4; --mute:#9aa59c; --line:#3a443b;
  --accent:#8fb293; --accent-weak:#2b362d; --plus:#7fb2e8; --minus:#ec8a80; --gold:#d9b25c;
  --r1:#8fb293; --r2:#5f7d5f; --r3:#a99a63; --r4:#a8695b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap,.card,.stack,.grid2>*,.grid3>*,.row>*{min-width:0}
input[type=date],input:not([type]),select{width:100%}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;letter-spacing:.04em}
header.top .sub{color:var(--mute);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.stack{display:grid;gap:12px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0;color:var(--mute);font-weight:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
button.primary{background:#4f6b55;color:#fff;border-color:#4f6b55}
button.wide{width:100%;min-height:48px;font-weight:bold}
button.ghost{background:transparent}
button.small{padding:3px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border-radius:999px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chip[aria-pressed="true"]{background:#4f6b55;color:#fff;border-color:#4f6b55;font-weight:bold}
.howto{margin:0;padding-left:18px}
nav.tabs button{white-space:nowrap;overflow:hidden}
@media (max-width:350px){nav.tabs{padding-inline:2px}nav.tabs button{font-size:10px;letter-spacing:-.04em}}
.seg{display:flex;gap:6px}.seg .chip{flex:1;padding:0 6px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--accent-weak);color:var(--accent);vertical-align:1px}
.tag.set{background:transparent;border:1px solid var(--line);color:var(--mute)}
.undobar{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;max-width:688px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:6px 8px 6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.undobar button{min-height:40px;background:transparent;color:inherit;border-color:currentColor}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:11px;color:var(--mute)}
.cal button{border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 0;min-height:56px;display:grid;grid-template-rows:14px 16px 8px;justify-items:center;align-items:center;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden}
.cal .d{font-size:11px;color:var(--mute)}
.cal .v{font-size:10.5px;font-weight:bold;letter-spacing:-.03em;white-space:nowrap}
.cal .m{display:flex;gap:3px}
.cal .m i{width:6px;height:6px;background:var(--mute);display:block}.cal .m i.free{border-radius:50%}
.cal .today{border-color:var(--accent)}.cal .sel{background:var(--accent-weak)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
input[type=number]{width:100%;text-align:right;font-variant-numeric:tabular-nums}
label.f{display:grid;gap:2px;font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{font-variant-numeric:tabular-nums}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:normal;color:var(--mute);font-size:12px}
.note{color:var(--mute);font-size:12px}
.warn{color:var(--minus);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:none;background:transparent;border-radius:10px;padding:6px 0;display:grid;gap:0;justify-items:center;font-size:11px;color:var(--mute);min-height:48px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-weak)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.item .meta{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chartbox{position:relative;height:220px}
.sfield{display:flex;gap:4px;align-items:stretch}
.sfield input{flex:1;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.sfield .pm{min-width:44px;min-height:44px;padding:0 11px;border-radius:10px;font-size:18px;line-height:1;background:var(--accent-weak);color:var(--accent);border-color:var(--line)}
.free-out{font-size:32px;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums}
.adbox{margin-top:12px;display:grid;justify-items:center;gap:2px}
.adbox iframe{border:0;width:300px;height:250px;max-width:100%}
.lock{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 6px;margin-left:6px}
textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px}
.sample{background:var(--accent-weak);color:var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>半荘ノート</h1><div class="sub">麻雀の点数・精算・成績 <span class="badge">試作版</span></div></div>
  </header>
  <main id="view" class="stack"></main>
  <aside id="adBox" class="adbox" aria-label="広告" hidden></aside>
</div>

<nav class="tabs" aria-label="画面の切り替え">
  <button data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>セッション</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>セット</button>
  <button data-tab="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h1M12 12h1M15 12h.5M8.5 16h1M12 16h1M15 16h.5"/></svg>フリー</button>
  <button data-tab="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 3.9 1.8 4.5 4.5"/></svg>ルール</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>成績</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>設定</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="core.js"></script>

<script>
const ADS_ON=false; // 広告を出すときだけ true。中身は frame.html
/* ===== 保存（この端末の中だけ） ===== */
const KEY="jakuroku-v1";
const uid=()=>Math.random().toString(36).slice(2,9);
let db, idb=null, saveBroken=false;
function sample(){
  const P=[["たろう","#4f6b55"],["はなこ","#2f6fb0"],["じろう","#c0443b"],["さぶろう","#b8892c"]].map(([name,color])=>({id:uid(),name,color,sample:true}));
  const [a,b,c,d]=P.map(p=>p.id);
  const mk=(date,title,tags,preset,members,games,chips,rate)=>{const rule={...RULE_PRESETS[preset]}; if(rate)rule.rate=rate;
    return {id:uid(),date,title,tags,rule,members,games:games.map(g=>({scores:Object.fromEntries(members.map((m,i)=>[m,g[i]]))})),chips:Object.fromEntries(members.map((m,i)=>[m,chips[i]])),sample:true};};
  const S=[
    mk("2026-08-02","駅前セット",["雀荘A"],"m4",[a,b,c,d],[[42000,31000,17000,10000],[25000,38000,22000,15000],[30500,30500,24000,15000]],[0,0,0,0],50),
    mk("2026-09-13","家麻雀",["家"],"m3",[a,b,c],[[52000,38000,15000],[30000,47000,28000],[61000,24000,20000]],[3,-1,-2],50),
    mk("2026-10-04","駅前セット",["雀荘A"],"m4",[a,b,c,d],[[18000,44000,26000,12000],[39000,27000,21000,13000]],[0,0,0,0],100),
    mk("2026-10-25","家麻雀",["家"],"m3",[a,b,d],[[45000,35000,25000],[20000,40000,45000],[50000,40000,15000]],[2,0,-2],100),
  ];
  return {players:P,sessions:S,saved:[],settings:{unlocked:false},sample:true};
}
function idbOpen(){ return new Promise((ok,ng)=>{const r=indexedDB.open("hanchan-note",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error);}); }
function idbDo(mode,fn){ return new Promise((ok,ng)=>{const tx=idb.transaction("kv",mode); const q=fn(tx.objectStore("kv")); tx.oncomplete=()=>ok(q.result); tx.onerror=tx.onabort=()=>ng(tx.error);}); }
// IndexedDB を先に見る。前の版の localStorage に記録があれば引き継ぐ
async function load(){
  let v=null, ls=null;
  try{ idb=await idbOpen(); v=await idbDo("readonly",s=>s.get("db")); snaps=await idbDo("readonly",s=>s.get("snaps"))||[]; }catch(e){ idb=null; }
  try{ ls=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(v && (!ls || (ls.savedAt||0)<=(v.savedAt||0))) return v;
  if(ls){ db=ls; save(); return ls; }
  return sample();
}
let saveQueue=Promise.resolve(), snaps=[];
// 落ちても失わないよう、その場で localStorage にも書く。起動のときは新しいほうを使う
function save(){
  db.savedAt=Date.now();
  const text=JSON.stringify(db);
  let kept=false; try{ localStorage.setItem(KEY,text); kept=true; }catch(e){}
  saveQueue=saveQueue.then(async()=>{
    try{ if(!idb) throw 0; await idbDo("readwrite",s=>s.put(JSON.parse(text),"db")); }
    catch(e){ if(!kept){ saveBroken=true; render(); } }
  });
}
function takeSnap(force){
  const next=nextSnaps(snaps,db,Date.now(),force);
  if(next===snaps||!idb) return;
  snaps=next;
  saveQueue=saveQueue.then(()=>idbDo("readwrite",s=>s.put(next,"snaps"))).catch(()=>{});
}
// 開いていた画面と入れかけの数字。アプリが落ちても、開き直せば続きから入れられる
const RESUME="hanchan-resume";
let resume={sc:{},free:{}};
function readResume(){
  try{ resume={...resume,...JSON.parse(localStorage.getItem(RESUME))}; }catch(e){}
  if(["stats","sessions","set","free","players","settings"].includes(resume.tab)) tab=resume.tab;
  openSession=resume.open||null;
  freeRank=resume.free.rank||1; freeTobi=!!resume.free.tobi;
}
function keepResume(){ try{ localStorage.setItem(RESUME,JSON.stringify({...resume,tab,open:openSession})); }catch(e){} }
const unlocked=()=>!!db.settings.unlocked;
const P=id=>db.players.find(p=>p.id===id)||{name:"?",color:"#888"};
const fmtAt=t=>new Date(t+9*3600e3).toISOString().slice(0,16).replace("T"," ");
const fmtP=v=>v===0?"±0P":(v>0?"+":"")+v.toLocaleString("ja-JP")+"P";
const fmtPt=v=>(v>0?"+":"")+v.toFixed(1);
const cls=v=>v>0?"plus":v<0?"minus":"";
const pct=v=>(v*100).toFixed(0)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);

/* ===== 画面 ===== */
let tab="sessions", openSession=null, charts=[];
let filter={from:"",to:"",mode:"",rates:[],tags:[],members:[],pick:[]};
const view=document.getElementById("view");
// スマホの数字キーには「-」が無いので、欄の横のボタンでマイナスにする
const sfield=(attrs,val="")=>`<span class="sfield"><button type="button" class="pm" data-pm aria-label="マイナスにする">−</button><input inputmode="decimal" autocomplete="off" ${attrs} value="${esc(val)}"></span>`;
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-pm]"); if(!b) return;
  e.preventDefault();
  const i=b.parentNode.querySelector("input"), body=i.value.replace(/[-−ー▲△\s]/g,"");
  i.value=/[-−ー▲△]/.test(i.value)?body:"-"+body;
  i.dispatchEvent(new Event("input",{bubbles:true}));
  if(body) i.dispatchEvent(new Event("change",{bubbles:true})); else i.focus();
});
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openSession=tab==="set"?todaySet():null;editGame=null;freeEdit=null;render();window.scrollTo(0,0);});

// 消す・直すは確認を出さず、8秒だけ「元に戻す」を出す。戻すのは操作の前の記録全体
let undo=null, undoTimer=null;
function undoable(label,fn){
  const before=JSON.stringify(db);
  fn(); save(); undo={label,before};
  clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{undo=null;const u=document.getElementById("undoBar");if(u)u.remove();},8000);
  render();
}
function render(){
  keepResume();
  charts.forEach(c=>c.destroy()); charts=[];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab));
  const banner = db.sample ? `<div class="sample"><span>いま入っているのは見本のデータです</span><button class="small" id="clearSample">見本を消して始める</button></div>`:"";
  const notice = db.settings.noticeDone ? "" : `<div class="sample"><span>記録はこの端末の中だけに残ります。iPhone はホーム画面に追加して使ってください。機種変更やブラウザのデータ削除で消えるので、残したいときはバックアップ（拡張機能）を使ってください。</span><button class="small" id="noticeOk">わかった</button></div>`;
  const broken = saveBroken ? `<p class="warn">記録を保存できませんでした。端末の空き容量を確かめてください。</p>`:"";
  const due = unlocked() && (tab==="stats"||(tab==="sessions"&&!openSession)) && backupDue(db,Date.now()) ? `<div class="sample"><span>ファイルに保存していない記録が ${unsavedGames(db)}半荘あります</span><button class="small" id="bkDue">保存する</button></div>`:"";
  const undoBar = undo ? `<div class="undobar" id="undoBar"><span>${esc(undo.label)}</span><button class="small" id="undoBtn">元に戻す</button></div>`:"";
  view.innerHTML = broken + notice + due + (tab==="free"?"":banner) + undoBar + ({stats:viewStats,sessions:viewSessions,set:viewSet,free:viewFree,players:viewPlayers,settings:viewSettings}[tab])();
  const cs=document.getElementById("clearSample"); if(cs) cs.onclick=()=>{db={players:[],sessions:[],saved:[],rules:db.rules,settings:db.settings,free:db.free};save();render();};
  const ub=document.getElementById("undoBtn"); if(ub) ub.onclick=()=>{db=JSON.parse(undo.before);undo=null;save();render();};
  const bd=document.getElementById("bkDue"); if(bd) bd.onclick=saveBackup;
  const no=document.getElementById("noticeOk"); if(no) no.onclick=()=>{db.settings.noticeDone=true;save();render();};
  ({stats:bindStats,sessions:bindSessions,set:bindSet,free:bindFree,players:bindPlayers,settings:bindSettings}[tab])();
  showAd();
}
// 成績タブの下にだけ出す。読み直しで表示回数が増えないよう、枠は1回だけ作る。記録に触れないよう隔離する
function showAd(){
  const box=document.getElementById("adBox");
  const on=ADS_ON && tab==="stats" && !unlocked() && navigator.onLine;
  box.hidden=!on;
  if(on && !box.firstChild) box.innerHTML=`<span class="note">広告</span><iframe src="frame.html" title="広告" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>`;
}

/* --- 成績 --- */
function allRates(){ return [...new Set([...db.sessions.map(s=>Number(s.rule.rate)),...freeState().games.map(g=>Number(g.rule.rate))])].sort((a,b)=>a-b); }
function allTags(){ return [...new Set(db.sessions.flatMap(s=>s.tags||[]))]; }
// 着順は人数が違うと比べられないので、四麻と三麻に分けて出す
const statModes=sel=>[...new Set(sel.map(s=>s.rule.mode))].sort((a,b)=>b-a);
const modeName=m=>m===3?"三麻":"四麻";
const rateName=r=>`レート${Number(r)/100}`;
const statSel=()=>filter.kind==="free"?[]:filterSessions(db.sessions,filter);
const freeSel=()=>filter.kind==="set"?[]:filterFree(freeState().games,filter);
function freeStatsCard(){
  const fs=freeSel();
  if(!fs.length) return filter.kind!=="set"&&freeState().games.length&&(filter.tags.length||filter.members.length||filter.pick.length)?`<p class="note">場所・メンバー・セッションを選んでいるので、フリーは集計に入っていません。</p>`:"";
  const row=m=>{const x=freeSummary(fs.filter(g=>g.rule.mode===m)); return x.games?`<tr><td>${modeName(m)}</td><td class="${cls(x.total)}">${fmtP(x.total)}</td><td class="${cls(x.point)}">${fmtPt(x.point)}</td><td>${x.games}</td><td>${x.avgRank.toFixed(2)}</td><td>${pct(x.top)}</td><td>${pct(x.lastAvoid)}</td></tr>`:"";};
  return `<section class="card"><h2>フリーの成績</h2><div class="tablebox"><table><thead><tr><th>種類</th><th>収支</th><th>ポイント</th><th>半荘</th><th>平均着順</th><th>トップ率</th><th>ラス回避</th></tr></thead><tbody>${row(4)}${row(3)}</tbody></table></div></section>`;
}

    <div class="row">${chipRow([{v:"",l:"すべて",on:!filter.kind},{v:"free",l:"フリー",on:filter.kind==="free"},{v:"set",l:"セット",on:filter.kind==="set"}],"kind")}</div>
    <div class="row"><span class="note">レート</span>${chipRow(allRates().map(r=>({v:r,l:rateName(r),on:filter.rates.includes(r)})),"rates")}</div>
    <div class="row"><span class="note">場所</span>${chipRow(allTags().map(t=>({v:t,l:t,on:filter.tags.includes(t)})),"tags")}</div>
    <div class="row"><span class="note">メンバーで絞る（選んだ人が全員いた回だけ）</span>${chipRow(db.players.map(p=>({v:p.id,l:p.name,on:filter.members.includes(p.id)})),"members")}</div>
    <details ${filter.pick.length?"open":""}><summary>セッションを選んで集計する（${filter.pick.length?filter.pick.length+"件選択中":"選ばなければ全部"}）</summary><div class="stack" style="margin-top:8px">${pickList||'<span class="note">記録がまだありません</span>'}</div></details>
    <div class="row between">
      <div class="row">${db.saved.map((sv,i)=>`<button class="chip" data-load="${i}">${esc(sv.name)}</button>`).join("")}</div>
      <div class="row"><button class="small ghost" id="freset">条件を外す</button><button class="small" id="fsave">この条件を保存${unlocked()?"":'<span class="lock">拡張</span>'}</button></div>
    </div>
    <div id="saveBox" hidden class="row"><input id="saveName" placeholder="例：三麻・今年"><button class="small primary" id="saveOk">保存</button></div>
    <div id="saveLock" hidden class="row"><span class="note">条件の保存は拡張機能です。設定タブで解放コードを入れると使えます。</span><button class="small" id="toSettings">設定へ</button></div>
  </section>
  ${freeStatsCard()}

function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function bindStats(){
  const upd=()=>render();
  document.getElementById("ffrom").onchange=e=>{filter.from=e.target.value;upd();};
  document.getElementById("fto").onchange=e=>{filter.to=e.target.value;upd();};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.f, v=b.dataset.v;
    if(k==="mode"||k==="kind"){filter[k]=v;}
    else{ const val = k==="rates"?Number(v):v; const a=filter[k]; const i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); }
    upd();
  });
  document.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{const id=c.dataset.pick;const i=filter.pick.indexOf(id); c.checked? (i<0&&filter.pick.push(id)) : (i>=0&&filter.pick.splice(i,1)); upd();});
  document.getElementById("freset").onclick=()=>{filter={from:"",to:"",mode:"",rates:[],tags:[],members:[],pick:[]};upd();};
  document.getElementById("fsave").onclick=()=>{
    if(!unlocked()){document.getElementById("saveLock").hidden=false;return;}
    document.getElementById("saveBox").hidden=false;document.getElementById("saveName").focus();};
  document.getElementById("toSettings").onclick=()=>{tab="settings";render();};
  document.getElementById("saveOk").onclick=()=>{const name=document.getElementById("saveName").value.trim()||"保存した条件";db.saved.push({name,filter:JSON.parse(JSON.stringify(filter))});save();render();};
  document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{filter=JSON.parse(JSON.stringify(db.saved[b.dataset.load].filter));render();});
  if(typeof Chart==="undefined" || !document.getElementById("c1")) return;
  const sel=statSel();
  const n = filter.mode? Number(filter.mode) : (sel.every(s=>s.rule.mode===3)&&sel.length?3:4);
  const st=playerStats(sel,n); const ids=Object.keys(st);
  const fg=cssv("--mute"), line=cssv("--line");
  Chart.defaults.color=fg; Chart.defaults.font.family=cssv("--font"); Chart.defaults.borderColor=line;
  const dates=[...new Set(sel.map(s=>s.date))].sort();
  charts.push(new Chart(document.getElementById("c1"),{type:"line",data:{labels:dates.map(d=>d.slice(5).replace("-","/")),
    datasets:ids.map(id=>{let last=0;const m=Object.fromEntries(st[id].hist.map(h=>[h.date,h.yen]));return {label:P(id).name,borderColor:P(id).color,backgroundColor:P(id).color,tension:.25,pointRadius:3,
      data:dates.map(d=>{if(d in m)last=m[d];return last;})};})},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}}},scales:{y:{ticks:{callback:v=>v.toLocaleString()+"P"}}}}}));
  const rc=[cssv("--r1"),cssv("--r2"),cssv("--r3"),cssv("--r4")];
  statModes(sel).forEach(m=>{ const ms=playerStats(sel.filter(s=>s.rule.mode===m),m), mi=Object.keys(ms);
    charts.push(new Chart(document.getElementById("c2-"+m),{type:"bar",data:{labels:mi.map(id=>P(id).name),
      datasets:Array.from({length:m},(_,k)=>({label:(k+1)+"着",backgroundColor:rc[k],data:mi.map(id=>{const p=ms[id];const g=p.dist.reduce((a,b)=>a+b,0)||1;return Math.round(p.dist[k]/g*100);})}))},
      options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}}},scales:{x:{stacked:true},y:{stacked:true,max:100,ticks:{callback:v=>v+"%"}}}}}));
  });
  const rates=[...new Set(sel.map(s=>Number(s.rule.rate)))].sort((a,b)=>a-b);
  if(rates.length>1) charts.push(new Chart(document.getElementById("c3"),{type:"bar",data:{labels:rates.map(r=>rateName(r)),
    datasets:ids.map(id=>({label:P(id).name,backgroundColor:P(id).color,data:rates.map(r=>{const t=playerStats(sel.filter(s=>Number(s.rule.rate)===r),n)[id];return t?t.yen:0;})}))},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}}},scales:{y:{ticks:{callback:v=>v.toLocaleString()+"P"}}}}}));
}

/* --- セッション：フリーの日とセットの会を1本で見て、開いて直す --- */
let logKind="all", logMonth=null, logDay=null;
const shortDate=d=>d.slice(5).replace("-","/");
const entryRow=e=>`<button class="item" data-open="${e.id}"><span><b class="num">${shortDate(e.date)}</b> <span class="tag ${e.kind}">${e.kind==="free"?"フリー":"セット"}</span> ${esc(e.title||e.place)}<br><span class="meta">${e.games}半荘${e.kind==="set"?`・${modeName(e.mode)}・${rateName(e.rate)}`:""}</span></span><b class="num ${e.total===null?"":cls(e.total)}">${e.total===null?"":fmtP(e.total)}</b></button>`;
const seg=(key,items,now)=>`<div class="seg">${items.map(([v,l])=>`<button class="chip" data-${key}="${v}" aria-pressed="${now===v}">${l}</button>`).join("")}</div>`;
function viewSessions(){
  if(openSession&&openSession.startsWith("free:")) return viewFreeDay(openSession.slice(5));
  if(openSession) return viewSession(db.sessions.find(s=>s.id===openSession));
  const es=logEntries(db).filter(e=>logKind==="all"||e.kind===logKind), sum=logTotals(es), cal=db.settings.sessionView==="calendar";
  return `<section class="card">
    ${seg("kind",[["all","すべて"],["free","フリー"],["set","セット"]],logKind)}
    ${seg("lview",[["list","一覧"],["calendar","カレンダー"]],cal?"calendar":"list")}
    <div class="row between"><span class="note">${sum.count}回・${sum.games}半荘</span><b class="free-sum ${cls(sum.total)}">${fmtP(sum.total)}</b></div>
    ${sum.unknown?`<div class="row between"><span class="note">自分が決まっていないか、自分のいないセット ${sum.unknown}回は合計に入っていません。</span><button class="small" id="toMe">自分を決める</button></div>`:""}
  </section>
  ${cal?calendarHTML(es):listHTML(es)}`;
}
function listHTML(es){
  if(!es.length) return `<section class="card"><p class="note">まだ記録がありません。セットかフリーのタブから入れてください。</p></section>`;
  const months=[...new Set(es.map(e=>e.date.slice(0,7)))];
  return months.map(m=>{const x=es.filter(e=>e.date.startsWith(m)), t=logTotals(x);
    return `<section class="card"><div class="row between"><h2>${m.replace("-","年")}月</h2><b class="${cls(t.total)}">${fmtP(t.total)}</b></div><div class="list">${x.map(entryRow).join("")}</div></section>`;}).join("");
}
function calendarHTML(es){
  const ym=logMonth||today().slice(0,7), days=dayMap(es), t=logTotals(es.filter(e=>e.date.startsWith(ym)));
  const cell=d=>{ if(!d) return "<span></span>"; const x=days[d];
    return `<button data-day="${d}" class="${d===today()?"today ":""}${d===logDay?"sel":""}" aria-label="${d}${x&&x.known?" "+fmtP(x.total):""}"><span class="d">${Number(d.slice(8))}</span><span class="v ${x&&x.known?cls(x.total):""}">${x&&x.known?(x.total>0?"+":"")+x.total.toLocaleString():""}</span><span class="m">${x?x.kinds.map(k=>`<i class="${k}"></i>`).join(""):""}</span></button>`;};
  const pick=logDay&&days[logDay];
  return `<section class="card">
    <div class="row between" style="flex-wrap:nowrap"><button class="small ghost" id="mPrev" aria-label="前の月">←</button><h2>${ym.replace("-","年")}月 <span class="${cls(t.total)}">${fmtP(t.total)}</span></h2><button class="small ghost" id="mNext" aria-label="次の月">→</button></div>
    <div class="cal">${"日月火水木金土".split("").map(w=>`<span class="wd">${w}</span>`).join("")}${monthGrid(ym).map(cell).join("")}</div>
    <p class="note">● フリー　■ セット</p>
    ${pick?`<div class="list">${pick.entries.map(entryRow).join("")}</div>`:""}
  </section>`;
}
function bindOpen(){ document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openSession=b.dataset.open;render();window.scrollTo(0,0);}); }
function bindSessions(){
  if(openSession&&openSession.startsWith("free:")) return bindFreeDay();
  if(openSession) return bindSession();
  bindOpen();
  document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{logKind=b.dataset.kind;render();});
  document.querySelectorAll("[data-lview]").forEach(b=>b.onclick=()=>{db.settings.sessionView=b.dataset.lview;save();render();});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{logDay=b.dataset.day;render();});
  const ym=logMonth||today().slice(0,7), go=n=>()=>{logMonth=shiftMonth(ym,n);logDay=null;render();};
  const p=document.getElementById("mPrev"); if(p){ p.onclick=go(-1); document.getElementById("mNext").onclick=go(1); }
  const me=document.getElementById("toMe"); if(me) me.onclick=()=>{tab="players";render();window.scrollTo(0,0);};
}

const presetOf=v=>{ if(v.startsWith("r:")){const x=db.rules.find(r=>r.id===v.slice(2)); return {label:x.name,tie:"seat",...x.rule};} return RULE_PRESETS[v]; };

function bindSet(){
  if(openSession) return bindSession();
  bindOpen();
  document.getElementById("newS").onclick=()=>{
    const box=document.getElementById("newBox"); box.hidden=false; box.innerHTML=newBoxHTML();
    const fill=()=>{const p=presetOf(document.getElementById("nPreset").value);
      document.getElementById("nRate").value=p.rate; document.getElementById("nChip").value=p.chipRate; document.getElementById("nFee").value=p.fee||0;
      document.getElementById("nStart").value=p.start;document.getElementById("nRet").value=p.ret;document.getElementById("nUma").value=p.uma.join(",");document.getElementById("nTie").value=p.tie||"split";};
    document.getElementById("nPreset").onchange=fill; fill();
    document.getElementById("nRate").onchange=e=>{document.getElementById("nChip").value=chipFor(presetOf(document.getElementById("nPreset").value).mode,e.target.value);};
    const mem=(db.settings.lastMembers||[]).filter(id=>db.players.some(p=>p.id===id));
    box.querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>{const i=mem.indexOf(b.dataset.mem); i>=0?mem.splice(i,1):mem.push(b.dataset.mem); b.setAttribute("aria-pressed",i<0);});
    document.getElementById("nOk").onclick=()=>{
      const p=JSON.parse(JSON.stringify(presetOf(document.getElementById("nPreset").value)));
      p.rate=Number(document.getElementById("nRate").value)||0; p.chipRate=Number(document.getElementById("nChip").value)||0; p.fee=Number(document.getElementById("nFee").value)||0;
      p.start=Number(document.getElementById("nStart").value)||p.start;p.ret=Number(document.getElementById("nRet").value)||p.ret;
      const u=document.getElementById("nUma").value.split(/[,、\s]+/).filter(Boolean).map(parseSigned); if(u.length===p.mode&&!u.includes(null))p.uma=u; p.tie=document.getElementById("nTie").value;

      const s={id:uid(),date:document.getElementById("nDate").value||today(),title:document.getElementById("nTitle").value.trim(),tags:document.getElementById("nTags").value.split(/\s+/).filter(Boolean),rule:p,members:mem.slice(),games:[],chips:{}};
      db.sessions.push(s); db.settings.lastMembers=mem.slice(); db.sample=false; save(); openSession=s.id; render(); window.scrollTo(0,0);
    };
  };
}
let editGame=null;
function viewSession(s){
  if(!s){openSession=null;editGame=null;return tab==="set"?viewSet():viewSessions();}
  if(editGame!==null&&!s.games[editGame]) editGame=null;
  const t=sessionTotals(s); const nets=Object.fromEntries(Object.entries(t).map(([k,v])=>[k,v.net])); const pay=settle(nets);
  const gap=Object.values(nets).reduce((a,b)=>a+b,0), chipOff=round1(chipGap(s)), fee=Number(s.rule.fee||0), hasExtra=(s.extras||[]).length>0;
  const head=s.members.map(id=>`<th>${esc(P(id).name)}</th>`).join("");
  const rows=s.games.map((g,gi)=>{const r=scoreGame(g.scores,s.rule,s.members);
    return `<tr><td>${gi+1}${r.ok?"":' <span class="warn">合計ずれ</span>'}</td>${s.members.map(id=>`<td><span class="num">${Number(g.scores[id]).toLocaleString()}</span><br><span class="note ${cls(r.res[id].point)}">${fmtPt(r.res[id].point)}</span></td>`).join("")}<td><button class="small ghost" data-edit="${gi}" aria-label="${gi+1}半荘目を直す">直す</button> <button class="small ghost" data-del="${gi}" aria-label="${gi+1}半荘目を消す">消す</button></td></tr>`;}).join("");
  return `<section class="card">
    <div class="row between"><button class="small ghost" id="back">← 戻る</button><span class="note">${s.rule.mode===3?"三麻":"四麻"}・持ち${s.rule.start}返し${s.rule.ret}・ウマ${s.rule.uma.join("/")}・${rateName(s.rule.rate)}</span></div>
    <h2><span class="num">${s.date}</span> ${esc(s.title||"")}</h2>
    <div class="tablebox"><table><thead><tr><th>半荘</th>${head}<th></th></tr></thead><tbody>${rows||""}</tbody></table></div>
    <div class="stack"><h3 id="gHead">${editGame===null?"終局の点数を入れる":`${editGame+1}半荘目を直す`}（合計 ${(s.rule.start*s.rule.mode).toLocaleString()}点）</h3>
      <p class="note">32 で 32000点、32.5 で 32500点。箱下は「−」を押します。</p>
      <div class="grid2">${s.members.map(id=>`<label class="f">${esc(P(id).name)}${sfield(`data-sc="${id}" placeholder="32"`,editGame===null?(resume.sc[s.id]||{})[id]??"":String(s.games[editGame].scores[id]/1000))}</label>`).join("")}</div>
      <button class="small ghost" id="auto">最後の1人を自動で埋める</button>
      <button class="primary wide" id="addG">${editGame===null?"この半荘を足す":"この半荘を直す"}</button>
      ${editGame===null?"":'<button class="small ghost" id="editNo">やめる</button>'}<span class="warn" id="gErr"></span>
    </div>
  </section>
  <section class="card"><h2>チップ（終わりに合計枚数）</h2>
    <div class="grid2">${s.members.map(id=>`<label class="f">${esc(P(id).name)}${sfield(`data-chip="${id}"`,(s.chips||{})[id]??0)}</label>`).join("")}</div>
    <p class="note">チップ1枚 ${s.rule.chipRate}P。小数も入れられます。</p>
    ${chipOff?`<p class="warn">チップの合計が ${chipOff}枚です。0枚になるはずなので確かめてください。</p>`:""}
  </section>
  ${extrasCard(s)}
  <section class="card"><h2>精算</h2>
    <div class="tablebox"><table><thead><tr><th>名前</th><th>ポイント</th><th>チップ</th>${hasExtra?"<th>その他</th>":""}<th>ゲーム代</th><th>収支</th></tr></thead><tbody>
    ${s.members.map(id=>`<tr><td><span class="dot" style="background:${P(id).color}"></span>${esc(P(id).name)}</td><td class="${cls(t[id].point)}">${fmtPt(t[id].point)}</td><td>${t[id].chips}</td>${hasExtra?`<td class="${cls(t[id].extra)}">${t[id].extra.toLocaleString()}</td>`:""}<td>${t[id].fee}</td><td class="${cls(t[id].yen)}"><b>${fmtP(t[id].yen)}</b></td></tr>`).join("")}
    </tbody></table></div>
    <div class="list">${pay.map(x=>`<div class="item" style="cursor:default"><span>${esc(P(x.from).name)} → ${esc(P(x.to).name)}</span><b class="num">${x.yen.toLocaleString()}P</b></div>`).join("")||'<span class="note">まだ精算はありません</span>'}</div>
    ${fee?`<p class="note">ゲーム代は1人 ${fee.toLocaleString()}P。店へ払う分なので、人の間の精算には入れず、収支からだけ引いています。</p>`:""}
    ${gap?`<p class="warn">やり取りの合計が ${gap.toLocaleString()}Pずれています。チップやその他の項目の回数を確かめてください。</p>`:""}
    <details><summary>日付・名前・ルールを直す</summary><div class="stack" style="margin-top:8px">
      <div class="grid2"><label class="f">日付<input type="date" id="sDate" value="${s.date}"></label><label class="f">名前<input id="sTitle" value="${esc(s.title||"")}"></label></div>
      <label class="f">場所・タグ（スペース区切り）<input id="sTags" value="${esc((s.tags||[]).join(" "))}"></label>
      <div class="grid3"><label class="f">千点あたり（P）<input inputmode="decimal" id="sRate" value="${s.rule.rate}"></label><label class="f">チップ1枚（P）<input inputmode="decimal" id="sChipR" value="${s.rule.chipRate}"></label><label class="f">ゲーム代（P）<input inputmode="decimal" id="sFee" value="${s.rule.fee||0}"></label></div>
      <div class="grid3"><label class="f">持ち点<input inputmode="numeric" id="sStart" value="${s.rule.start}"></label><label class="f">返し<input inputmode="numeric" id="sRet" value="${s.rule.ret}"></label><label class="f">ウマ<input id="sUma" value="${s.rule.uma.join(",")}"></label></div>
      <button class="small primary" id="sSave">直す</button><span class="warn" id="sErr"></span>
    </div></details>
    <div class="row"><button class="small ghost" id="delS">このセッションを消す</button><span id="delConfirm" hidden><button class="small" id="delYes">本当に消す</button></span></div>
  </section>`;
}
function extrasCard(s){
  const items=(s.extras||[]).map(x=>{const off=round1(extraGap(x));return `<div class="stack">
    <div class="row between"><b>${esc(x.name)}</b><span class="row"><span class="note">1回 ${Number(x.price).toLocaleString()}P</span><button class="small ghost" data-xdel="${x.id}" aria-label="${esc(x.name)}を消す">消す</button></span></div>
    <div class="grid2">${s.members.map(id=>`<label class="f">${esc(P(id).name)}${sfield(`data-xid="${x.id}" data-xp="${id}"`,(x.counts||{})[id]??0)}</label>`).join("")}</div>
    ${off?`<p class="warn">回数の合計が ${off}回です。もらう人と払う人が釣り合っていません（差し入れなど、わざとならそのままで大丈夫です）。</p>`:""}
  </div>`;}).join("");
  const body=`<p class="note">祝儀・焼き鳥・トビ賞など。もらう人はプラス、払う人はマイナスの回数を入れます。</p>
    ${items}
    <div class="grid2"><label class="f">項目の名前<input id="xName" placeholder="例：トビ賞"></label><label class="f">1回あたり（P）<input type="number" inputmode="numeric" id="xPrice" placeholder="例 1000"></label></div>
    <div class="row"><button class="small" id="xAdd">項目を足す</button><span class="warn" id="xErr"></span></div>`;
  return items?`<section class="card"><h2>その他の項目</h2>${body}</section>`:`<section class="card"><details><summary>その他の項目を足す</summary><div class="stack" style="margin-top:8px">${body}</div></details></section>`;
}
function bindExtras(s){
  const add=document.getElementById("xAdd"); if(!add) return;
  add.onclick=()=>{
    const name=document.getElementById("xName").value.trim(), price=Number(document.getElementById("xPrice").value);
    if(!name||!price){document.getElementById("xErr").textContent="名前と数を入れてください";return;}
    s.extras=s.extras||[]; s.extras.push({id:uid(),name,price,counts:{}}); db.sample=false; save(); render();
  };
  document.querySelectorAll("[data-xp]").forEach(i=>{const x=s.extras.find(v=>v.id===i.dataset.xid);
    i.oninput=()=>{const n=parseSigned(i.value); if(n!==null){x.counts[i.dataset.xp]=n;save();}};
    i.onchange=()=>{x.counts[i.dataset.xp]=parseSigned(i.value)||0; save(); render();};});
  document.querySelectorAll("[data-xdel]").forEach(b=>b.onclick=()=>{s.extras=s.extras.filter(v=>v.id!==b.dataset.xdel); save(); render();});
}
function bindSession(){
  const s=db.sessions.find(x=>x.id===openSession); if(!s) return;
  bindExtras(s);
  document.getElementById("back").onclick=()=>{openSession=null;editGame=null;render();window.scrollTo(0,0);};
  const inputs=[...document.querySelectorAll("[data-sc]")];
  const keepScores=()=>{ if(editGame!==null) return; resume.sc[s.id]=Object.fromEntries(inputs.map(i=>[i.dataset.sc,i.value])); keepResume();};
  inputs.forEach(i=>i.oninput=keepScores);
  document.getElementById("auto").onclick=()=>{const empty=inputs.filter(i=>i.value.trim()==="");if(empty.length!==1){document.getElementById("gErr").textContent="空いている欄が1つのときに使えます";return;}
    const vals=inputs.filter(i=>i.value.trim()!=="").map(i=>parseScore(i.value));
    if(vals.includes(null)){document.getElementById("gErr").textContent="読めない点数があります";return;}
    empty[0].value=String((s.rule.start*s.rule.mode-vals.reduce((a,b)=>a+b,0))/1000); keepScores();};
  document.getElementById("addG").onclick=()=>{
    if(inputs.some(i=>i.value.trim()==="")){document.getElementById("gErr").textContent="全員の点数を入れてください";return;}
    const scores=Object.fromEntries(inputs.map(i=>[i.dataset.sc,parseScore(i.value)]));
    if(Object.values(scores).includes(null)){document.getElementById("gErr").textContent="読めない点数があります";return;}
    const r=scoreGame(scores,s.rule,s.members);
    if(!r.ok){document.getElementById("gErr").textContent=`合計が${r.total.toLocaleString()}点です（${r.expected.toLocaleString()}点のはず）`;return;}
    if(editGame!==null){ const i=editGame; editGame=null; undoable("半荘を直しました",()=>{s.games[i].scores=scores;}); return; }
    s.games.push({scores}); db.sample=false; delete resume.sc[s.id]; save(); render();
  };
  const no=document.getElementById("editNo"); if(no) no.onclick=()=>{editGame=null;render();};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editGame=Number(b.dataset.edit);render();document.getElementById("gHead").scrollIntoView({block:"center"});});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{editGame=null;undoable("半荘を消しました",()=>{s.games.splice(Number(b.dataset.del),1);});});
  document.getElementById("sSave").onclick=()=>{
    const v=id=>document.getElementById(id).value, u=v("sUma").split(/[,、\s]+/).filter(Boolean).map(parseSigned), nums=["sRate","sChipR","sFee","sStart","sRet"].map(id=>parseSigned(v(id)));
    if(u.length!==s.rule.mode||u.includes(null)){document.getElementById("sErr").textContent=`ウマは${s.rule.mode}つ入れてください`;return;}
    if(nums.includes(null)||!v("sDate")){document.getElementById("sErr").textContent="日付と数字を入れてください";return;}
    undoable("この回を直しました",()=>{ s.date=v("sDate"); s.title=v("sTitle").trim(); s.tags=v("sTags").split(/\s+/).filter(Boolean);
      [s.rule.rate,s.rule.chipRate,s.rule.fee,s.rule.start,s.rule.ret]=nums; s.rule.uma=u; });
  };
  document.querySelectorAll("[data-chip]").forEach(i=>{
    i.oninput=()=>{const n=parseSigned(i.value); if(n!==null){s.chips=s.chips||{};s.chips[i.dataset.chip]=n;save();}};
    i.onchange=()=>{s.chips=s.chips||{};s.chips[i.dataset.chip]=parseSigned(i.value)||0;save();render();};});
  document.getElementById("delS").onclick=()=>{document.getElementById("delConfirm").hidden=false;};
  document.getElementById("delYes").onclick=()=>{db.sessions=db.sessions.filter(x=>x.id!==s.id);delete resume.sc[s.id];save();openSession=null;render();};
}

/* --- フリー：自分の点数と着順だけで、その半荘の結果を出す。記録はその日のセッションに入る --- */
const FREE_RULES={
  4:{mode:4,start:25000,ret:30000,uma:[30,10,-10,-30],tobi:0},
  3:{mode:3,start:35000,ret:40000,uma:[20,0,-20],tobi:10},
};
let freeRank=1, freeTobi=false, freeOpen=null, freeFlash="", freeEdit=null;
function freeState(){ return db.free || (db.free={rule:{...JSON.parse(JSON.stringify(FREE_RULES[4])),rate:50,chipRate:0,fee:0,feeTop:""},games:[]}); }
const quickHTML=r=>`<thead><tr><th>点数</th>${Array.from({length:r.mode},(_,k)=>`<th>${k+1}着</th>`).join("")}</tr></thead><tbody>${quickTable(r).map(x=>`<tr><td>${x.score.toLocaleString()}</td>${x.cells.map(v=>v===null?'<td class="note">−</td>':`<td class="${cls(v)}">${fmtP(v)}</td>`).join("")}</tr>`).join("")}</tbody>`;
function freeLine(g){ return freeResult(g.score,g.rank,g.chips,g.rule,g.tobiWin); }
const ruleCopy=r=>JSON.parse(JSON.stringify({mode:r.mode,start:r.start,ret:r.ret,uma:r.uma,rate:r.rate,chipRate:r.chipRate,fee:r.fee||0,feeTop:r.feeTop??"",tobi:r.tobi||0}));
const ruleKey=r=>JSON.stringify(ruleCopy(r));
const ruleLine=r=>`${modeName(r.mode)}・${r.start}持ち${r.ret}返し・ウマ${r.uma.join("/")}${r.tobi?`・トビ賞${r.tobi}`:""}・${rateName(r.rate)}${r.chipRate?`・チップ${r.chipRate}P`:""}${r.fee?`・ゲーム代${r.fee}P`:""}`;
function setFreeMode(r,m){ Object.assign(r,JSON.parse(JSON.stringify(FREE_RULES[m]))); r.chipRate=chipFor(m,r.rate); if(freeRank>m) freeRank=1; }
function saveRule(name){
  const r=freeState().rule, x=db.rules.find(v=>v.name===name);
  if(x) x.rule=ruleCopy(r); else db.rules.push({id:uid(),name,rule:ruleCopy(r),place:""});
  save();
}
const freeItem=g=>{const x=freeLine(g);return `<div class="item" style="cursor:default"><span>${g.rank}着 <span class="num">${g.score.toLocaleString()}点</span>${g.chips?`<span class="note"> チップ${g.chips}</span>`:""}${g.tobiWin?'<span class="note"> 飛ばした</span>':""}</span><span class="row"><b class="${cls(x.total)}">${fmtP(x.total)}</b><button class="small ghost" data-fedit="${g.id}" aria-label="この半荘を直す">直す</button><button class="small ghost" data-fdel="${g.id}" aria-label="この半荘を消す">消す</button></span></div>`;};
function viewFree(){
  const f=freeState(), r=f.rule, day=today(), kept=resume.free;
  if(freeRank>r.mode) freeRank=1;
  const todays=f.games.filter(g=>g.date===day), sum=freeSummary(todays).total, open=freeOpen===null?!f.games.length:freeOpen;
  return `<section class="card"><div class="row between"><h2>この半荘の結果</h2><span class="note">今日 <b class="${cls(sum)}">${fmtP(sum)}</b></span></div>
    <ol class="note howto"><li>四麻か三麻を選ぶ（ルールは最初に一度決めるだけ）</li><li>着順を押して、点数を入れる（30 で 30000点、5- で箱下）</li><li>「記録する」で今日の合計が出る</li></ol>
    ${seg("fmode",[[4,"四麻"],[3,"三麻"]],r.mode)}
    ${db.rules.length?`<div class="row">${db.rules.map(x=>`<button class="chip" data-rapply="${x.id}" aria-pressed="${ruleKey(x.rule)===ruleKey(r)}">${esc(x.name)}</button>`).join("")}</div>`:""}
    <p class="note" id="fRuleNow">${ruleLine(r)}</p>
    <div class="seg">${Array.from({length:r.mode},(_,k)=>`<button class="chip" data-frank="${k+1}" aria-pressed="${freeRank===k+1}">${k+1}着</button>`).join("")}</div>
    <div class="grid2"><label class="f">自分の点数${sfield('id="fScore" placeholder="30"',kept.score||"")}</label><label class="f">チップ（任意）${sfield('id="fChip" placeholder="0"',kept.chip||"")}</label></div>
    ${r.tobi?`<button class="chip" id="fTobi" aria-pressed="${freeTobi}">飛ばした（+${r.tobi}）</button>`:""}
    <div class="free-out" id="fOut" aria-live="polite">-</div>
    <p class="note" id="fDetail">点数を入れると、ここに結果が出ます。</p>
    <button class="primary wide" id="fAdd">記録する</button>
    <span class="warn" id="fErr"></span>${freeFlash?`<span class="note" role="status">${esc(freeFlash)}</span>`:""}
  </section>
  <section class="card"><div class="row between"><h2>今日の半荘</h2><span class="note">${todays.length}半荘</span></div>
    <div class="list">${todays.slice().reverse().map(freeItem).join("")||'<p class="note">まだ記録がありません。記録はセッションのタブにも入ります</p>'}</div>
  </section>
  <section class="card"><details id="fRules" ${open?"open":""}><summary>ルールを変える</summary><div class="stack" style="margin-top:8px">
    <div class="grid2"><label class="f">持ち点<input inputmode="numeric" data-frule="start" value="${r.start}"></label><label class="f">返し<input inputmode="numeric" data-frule="ret" value="${r.ret}"></label></div>
    <div class="grid2"><label class="f">ウマ（上から順に、カンマ区切り）<input data-frule="uma" value="${r.uma.join(",")}"></label><label class="f">トビ賞（なしは0）<input inputmode="decimal" data-frule="tobi" value="${r.tobi||0}"></label></div>
    <div class="grid2"><label class="f">千点あたり（P）<input inputmode="decimal" data-frule="rate" value="${r.rate}"></label><label class="f">チップ1枚（P）<input inputmode="decimal" data-frule="chipRate" value="${r.chipRate}"></label></div>
    <div class="grid2"><label class="f">ゲーム代（P）<input inputmode="decimal" data-frule="fee" value="${r.fee}"></label><label class="f">トップのゲーム代（同じなら空）<input inputmode="decimal" data-frule="feeTop" value="${r.feeTop}"></label></div>
    <span class="warn" id="fRuleErr"></span>
    <div class="row"><input id="rName" placeholder="ルールの名前（例：いつもの三麻）" style="flex:1"><button class="small" id="rSave">このルールを保存</button></div>
  </div></details></section>
  <section class="card"><h2>点数の早見表</h2>
    <p class="note">いまのルールでの結果です。チップは入れず、ゲーム代は引いています。飛ばしたときのトビ賞は入っていません。「−」は起こらない組み合わせです。</p>
    <div class="tablebox"><table id="fTable">${quickHTML(r)}</table></div></section>`;
}
function bindFree(){
  const f=freeState(), r=f.rule;
  const score=document.getElementById("fScore"), chip=document.getElementById("fChip");
  const paint=()=>{
    document.getElementById("fRuleNow").textContent=ruleLine(r);
    document.getElementById("fTable").innerHTML=quickHTML(r);
    const out=document.getElementById("fOut"), sc=parseScore(score.value);
    if(sc===null){ out.textContent="-"; out.className="free-out"; return; }
    const x=freeResult(sc,freeRank,parseSigned(chip.value)||0,r,freeTobi);
    out.textContent=fmtP(x.total); out.className="free-out "+cls(x.total);
    document.getElementById("fDetail").textContent=`${sc.toLocaleString()}点・${freeRank}着：ポイント ${fmtPt(x.point)}${x.fee?`、ゲーム代 ${x.fee.toLocaleString()}P`:""}`;
  };
  const keepFree=()=>{resume.free={score:score.value,chip:chip.value,rank:freeRank,tobi:freeTobi}; keepResume();};
  score.oninput=chip.oninput=()=>{paint(); keepFree();};
  document.querySelectorAll("[data-frank]").forEach(b=>b.onclick=()=>{freeRank=Number(b.dataset.frank);
    document.querySelectorAll("[data-frank]").forEach(c=>c.setAttribute("aria-pressed",c===b)); paint(); keepFree();});
  const tobi=document.getElementById("fTobi"); if(tobi) tobi.onclick=()=>{freeTobi=!freeTobi; tobi.setAttribute("aria-pressed",freeTobi); paint(); keepFree();};
  document.getElementById("fAdd").onclick=()=>{
    const sc=parseScore(score.value);
    if(sc===null){document.getElementById("fErr").textContent="点数を入れてください";return;}
    const g={id:uid(),date:today(),score:sc,rank:freeRank,chips:parseSigned(chip.value)||0,tobiWin:freeTobi,rule:ruleCopy(r)};
    f.games.push(g); db.sample=false; freeTobi=false; resume.free={rank:freeRank}; save();
    const t=freeSummary(f.games.filter(x=>x.date===g.date)).total;
    freeFlash=`記録しました　この半荘 ${fmtP(freeLine(g).total)}　今日 ${fmtP(t)}`; render(); freeFlash="";
  };
  document.getElementById("fRules").ontoggle=e=>{freeOpen=e.target.open;};
  document.querySelectorAll("[data-fmode]").forEach(b=>b.onclick=()=>{setFreeMode(r,Number(b.dataset.fmode));freeTobi=false;save();render();});
  document.querySelectorAll("[data-rapply]").forEach(b=>b.onclick=()=>{Object.assign(r,ruleCopy(db.rules.find(x=>x.id===b.dataset.rapply).rule));if(freeRank>r.mode)freeRank=1;save();render();});
  document.querySelectorAll("[data-frule]").forEach(i=>i.onchange=()=>{
    const k=i.dataset.frule, msg=document.getElementById("fRuleErr"); msg.textContent="";
    if(k==="uma"){ const u=i.value.split(/[,、\s]+/).filter(Boolean).map(parseSigned);
      if(u.length!==r.mode||u.includes(null)){msg.textContent=`ウマは${r.mode}つ入れてください`;return;}
      r.uma=u; }
    else if(k==="feeTop"&&i.value.trim()==="") r.feeTop="";
    else{ const n=parseSigned(i.value); if(n===null){msg.textContent="数字を入れてください";return;}
      if(k==="rate"&&r.chipRate===chipFor(r.mode,r.rate)){ r.chipRate=chipFor(r.mode,n); document.querySelector('[data-frule="chipRate"]').value=r.chipRate; }
      r[k]=n; }
    save(); paint();
  });
  document.getElementById("rSave").onclick=()=>{const n=document.getElementById("rName").value.trim(); if(!n){document.getElementById("fRuleErr").textContent="ルールの名前を入れてください";return;} saveRule(n); render();};
  bindFreeRows(f);
  paint();
}
function bindFreeRows(f){
  document.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>{freeEdit=null;undoable("半荘を消しました",()=>{f.games=f.games.filter(g=>g.id!==b.dataset.fdel);});});
  document.querySelectorAll("[data-fedit]").forEach(b=>b.onclick=()=>{const g=f.games.find(x=>x.id===b.dataset.fedit); tab="sessions"; openSession="free:"+g.date; freeEdit=g.id; render();
    const e=document.getElementById("eForm"); if(e) e.scrollIntoView({block:"center"});});
}
// フリーの1日：半荘を開いて、点数・着順・チップ・日付・ルールを直す
function viewFreeDay(day){
  const gs=freeState().games.filter(g=>g.date===day);
  if(!gs.length){ openSession=null; freeEdit=null; return viewSessions(); }
  const x=freeSummary(gs);
  const form=g=>`<div class="stack" id="eForm"><div class="seg">${Array.from({length:4},(_,k)=>`<button class="chip" data-erank="${k+1}" aria-pressed="${g.rank===k+1}">${k+1}着</button>`).join("")}</div>
    <div class="grid2"><label class="f">点数${sfield('id="eScore"',String(g.score/1000))}</label><label class="f">チップ${sfield('id="eChip"',g.chips||0)}</label></div>

    <button class="primary wide" id="eOk">この半荘を直す</button><div class="row"><button class="small ghost" id="eNo">やめる</button><span class="warn" id="eErr"></span></div></div>`;

    <div class="list">${gs.map(g=>g.id===freeEdit?form(g):freeItem(g)).join("")}</div></section>`;
}
function bindFreeDay(){
  const f=freeState();
  document.getElementById("back").onclick=()=>{openSession=null;freeEdit=null;render();window.scrollTo(0,0);};
  bindFreeRows(f);
  const g=f.games.find(x=>x.id===freeEdit); if(!g||!document.getElementById("eForm")) return;
  let rank=g.rank, tobi=!!g.tobiWin;
  document.querySelectorAll("[data-erank]").forEach(b=>b.onclick=()=>{rank=Number(b.dataset.erank);document.querySelectorAll("[data-erank]").forEach(c=>c.setAttribute("aria-pressed",c===b));});
  const t=document.getElementById("eTobi"); t.onclick=()=>{tobi=!tobi;t.setAttribute("aria-pressed",tobi);};
  document.getElementById("eNo").onclick=()=>{freeEdit=null;render();};
  document.getElementById("eOk").onclick=()=>{
    const err=document.getElementById("eErr"), sc=parseScore(document.getElementById("eScore").value), v=document.getElementById("eRule").value, date=document.getElementById("eDate").value;
    const rule=!v?g.rule:v==="m4"||v==="m3"?{...ruleCopy(g.rule),...JSON.parse(JSON.stringify(FREE_RULES[v.slice(1)]))}:ruleCopy(db.rules.find(r=>r.id===v).rule);
    if(sc===null||!date){err.textContent="点数と日付を入れてください";return;}
    if(rank>rule.mode){err.textContent=`このルールは${rule.mode}着までです`;return;}
    freeEdit=null; openSession="free:"+date;
    undoable("半荘を直しました",()=>{ Object.assign(g,{score:sc,rank,chips:parseSigned(document.getElementById("eChip").value)||0,tobiWin:tobi,date,rule}); });
  };
}

function csvRows(){
  const rows=[["日付","名前","場所","ルール","千点あたり(P)","半荘","メンバー","点数","着順","ポイント"]];
  db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.games.forEach((g,gi)=>{const r=scoreGame(g.scores,s.rule,s.members);
    s.members.forEach(id=>rows.push([s.date,s.title||"",(s.tags||[]).join(" "),s.rule.mode===3?"三麻":"四麻",s.rule.rate,gi+1,P(id).name,g.scores[id],r.res[id].rank,r.res[id].point]));}));
  freeDays(freeState().games).reverse().forEach(d=>d.items.forEach((g,i)=>rows.push([g.date,"フリー","",modeName(g.rule.mode),g.rule.rate,i+1,"自分",g.score,g.rank,freeLine(g).point])));
  return rows;
}
function settleRows(){
  const rows=[["日付","名前","場所","ルール","千点あたり(P)","メンバー","半荘数","ポイント","チップ","その他","ゲーム代","収支"]];
  db.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const t=sessionTotals(s);
    s.members.forEach(id=>rows.push([s.date,s.title||"",(s.tags||[]).join(" "),s.rule.mode===3?"三麻":"四麻",s.rule.rate,P(id).name,t[id].games,t[id].point,t[id].chips,t[id].extra,t[id].fee,t[id].yen]));});
  freeDays(freeState().games).reverse().forEach(d=>{const uniq=f=>[...new Set(d.items.map(f))].join("/"), line=d.items.map(freeLine);
    rows.push([d.date,"フリー","",uniq(g=>modeName(g.rule.mode)),uniq(g=>g.rule.rate),"自分",d.games,d.point,d.items.reduce((a,g)=>a+g.chips,0),"",line.reduce((a,x)=>a+x.fee,0),d.total]);});
  return rows;
}
function stamp(){ return today().replace(/-/g,""); }
// スマホは共有の画面を出す。iPhone はここから「ファイル」に保存できる。やめたら "cancel"
async function saveFile(name,blob){
  const file=new File([blob],name,{type:blob.type.split(";")[0]});
  if(navigator.maxTouchPoints>0 && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return "done"; }
    catch(e){ if(e.name==="AbortError") return "cancel"; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  return "done";
}
const SAVED_MSG="保存しました。見つからないときは下の文字のコピーを使ってください";
async function saveBackup(){
  if(await saveFile(`hanchan-note-${stamp()}.json`,new Blob([JSON.stringify(db)],{type:"application/json"}))==="cancel") return;

  const m=document.getElementById("bkMsg"); if(m) m.textContent=SAVED_MSG;
}
const CSV_TYPE={type:"text/csv;charset=utf-8"};
function csvBlob(rows){ return new Blob(["﻿"+toCSV(rows)],CSV_TYPE); }
function loadXLSX(){ return window.XLSX?Promise.resolve():new Promise((ok,ng)=>{const t=document.createElement("script"); t.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; t.onload=ok; t.onerror=ng; document.head.appendChild(t);}); }
async function xlsxBlob(){
  await loadXLSX();
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(csvRows()),"半荘ごと");

}

const SUMMARY_ROWS=[["sets","セットの回数"],["setGames","セットの半荘"],["freeGames","フリーの半荘"],["players","メンバー"],["rules","保存したルール"],["last","最後の記録"],["code","照合の番号"]];
function bindRestore(){
  let pending=null;
  const read=text=>{ const msg=document.getElementById("rsMsg"), box=document.getElementById("rsConfirm"); msg.textContent=""; box.hidden=true;
    try{ const d=JSON.parse(text); if(!isBackup(d)) throw 0; pending=d;
      const a=backupSummary(db), b=backupSummary(d);
      document.getElementById("rsTable").innerHTML=`<thead><tr><th></th><th>いま</th><th>ファイル</th></tr></thead><tbody>${SUMMARY_ROWS.map(([k,l])=>`<tr><td>${l}</td><td>${esc(a[k])}</td><td>${esc(b[k])}</td></tr>`).join("")}</tbody>`;
      document.getElementById("rsInfo").textContent="「置き換える」を押すと、いまの記録がファイルの中身に変わります。いまの記録は自動の控えに残します。";
      box.hidden=false; box.scrollIntoView({block:"center"}); }
    catch(e){ msg.textContent="読み取れませんでした。バックアップのファイルか、コピーした文字を全部入れてください"; } };
  document.querySelectorAll("[data-snap]").forEach(b=>b.onclick=()=>read(snaps[Number(b.dataset.snap)].text));
  document.getElementById("rsOk").onclick=()=>read(document.getElementById("rs").value);
  document.getElementById("rsFile").onchange=async e=>{ const f=e.target.files[0]; if(f) read(await f.text()); };
  document.getElementById("rsYes").onclick=async()=>{ if(!pending) return;
    const want=backupSummary(pending).code;
    takeSnap(true);
    db={...pending,saved:pending.saved||[],rules:pending.rules||[],sample:false,settings:{...pending.settings,unlocked:unlocked()||!!(pending.settings&&pending.settings.unlocked),noticeDone:true}};
    openSession=null; undo=null; save(); await saveQueue;
    let back=null; try{ back=idb?await idbDo("readonly",s=>s.get("db")):JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    restoreMsg=back&&backupSummary(back).code===want?"戻しました。端末に書いた記録を読み直して、ファイルと同じ内容だと確かめました。":"戻しましたが、確かめの読み直しで違いが出ました。もう一度戻してください。";
    render(); window.scrollTo(0,0); };
}

// 前の版の記録に足りない項目を補う。三麻の初期設定が前の既定のままなら新しい既定にする（過去の半荘はルールの写しを持つので動かない）
function upgrade(){
  db.rules=db.rules||[];
  const r=db.free&&db.free.rule;
  if(r&&r.mode===3&&r.uma.every(u=>!u)&&!r.tobi){ r.uma=[20,0,-20]; r.tobi=10; r.chipRate=r.chipRate||chipFor(3,r.rate); }
}

(async()=>{
  db=await load();
  upgrade();
  readResume();
  render();
  takeSnap();
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) takeSnap(); });
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
